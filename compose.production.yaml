name: exwebsite-deployment
services:
  server:
    image: ${WEBSITE_SERVER_IMAGE:?explicit versioned Website server image required}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?independent exre database required}
      AUTH_CODE_HMAC_KEY: ${AUTH_CODE_HMAC_KEY:?required}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      SERVER_PUBLIC_WEB_BASE_URL: ${PUBLIC_ORIGIN:?explicit HTTPS origin required}
      SERVER_PUBLIC_AVATAR_BASE_URL: ${PUBLIC_ORIGIN}/api/avatars
      SERVER_AVATAR_DIRECTORY: /var/lib/website/avatars
      STORAGE_DEFAULT_ADAPTER: ${STORAGE_DEFAULT_ADAPTER:-file}
      STORAGE_UPLOAD_HMAC_KEY: ${STORAGE_UPLOAD_HMAC_KEY:-}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-26214400}
      STORAGE_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN}/api
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      WEBSITE_INTEGRATION_ENABLED: 'true'
      WEBSITE_INTEGRATION_MODE: deployment
      HYDRA_PUBLIC_URL: ${HYDRA_PUBLIC_URL:?explicit HTTPS issuer required}
      HYDRA_ADMIN_URL: ${HYDRA_ADMIN_URL:?explicit private address required}
      WEBSITE_INTERNAL_URL: ${WEBSITE_INTERNAL_URL:?explicit private address required}
      OUTLINE_INTERNAL_URL: ${OUTLINE_INTERNAL_URL:?explicit private address required}
      OUTLINE_OIDC_CLIENT_ID: ex-outline
      OUTLINE_OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?required}
      OUTLINE_INTEGRATION_KEY: ${OUTLINE_INTEGRATION_KEY:?required}
      IDENTITY_BOOTSTRAP_KEY: ${IDENTITY_BOOTSTRAP_KEY:?required}
      IDENTITY_FLOW_KEY: ${IDENTITY_FLOW_KEY:?required}
      IDENTITY_DELIVERY_KEY: ${IDENTITY_DELIVERY_KEY:?required}
      IDENTITY_OUTBOX_TARGETS_JSON: ${IDENTITY_OUTBOX_TARGETS_JSON:-{}}
      IDENTITY_DEPLOYMENT_RECEIPT_FILE: /run/exwebsite/identity.json
    ports: ['127.0.0.1:18080:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - website-avatars:/var/lib/website/avatars
      - website-uploads:/workspace/website/apps/server/data/uploads
      - website-upload-tmp:/workspace/website/apps/server/data/upload-tmp
      - type: bind
        source: ./.local/runtime-deployment/identity.json
        target: /run/exwebsite/identity.json
        read_only: true
        bind: { create_host_path: false }
  outline:
    image: ${OUTLINE_IMAGE:?explicit versioned customized Outline image required}
    command: [node, build/server/index.js, --no-migrate]
    environment:
      NODE_ENV: production
      RUNTIME_ENV_INJECTED: 'true'
      URL: ${PUBLIC_ORIGIN}/docs
      WEBSITE_URL: ${PUBLIC_ORIGIN}/
      PORT: '3000'
      FORCE_HTTPS: 'true'
      DATABASE_URL: ${OUTLINE_DATABASE_URL:?independent outline database required}
      REDIS_URL: ${OUTLINE_REDIS_URL:?explicit Redis address required}
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?required}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?required}
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: ${OUTLINE_STORAGE_DIRECTORY:?absolute container storage path required}
      WEBSITE_INTEGRATION_ENABLED: 'true'
      WEBSITE_INTEGRATION_MODE: deployment
      HYDRA_PUBLIC_URL: ${HYDRA_PUBLIC_URL}
      WEBSITE_INTERNAL_URL: ${WEBSITE_INTERNAL_URL}
      OUTLINE_OIDC_CLIENT_ID: ex-outline
      OUTLINE_OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET}
      OUTLINE_INTEGRATION_KEY: ${OUTLINE_INTEGRATION_KEY}
      IDENTITY_BOOTSTRAP_KEY: ${IDENTITY_BOOTSTRAP_KEY}
      IDENTITY_DELIVERY_KEY: ${IDENTITY_DELIVERY_KEY}
    ports: ['127.0.0.1:13000:3000']
    volumes: ['outline-attachments:${OUTLINE_STORAGE_DIRECTORY}']
  hydra:
    image: oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    command: [serve, all]
    environment:
      DSN: ${HYDRA_DATABASE_URL:?independent hydra database required}
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?required}
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_URL}
      URLS_LOGIN: ${PUBLIC_ORIGIN}/identity/login
      URLS_CONSENT: ${PUBLIC_ORIGIN}/identity/consent
      URLS_LOGOUT: ${PUBLIC_ORIGIN}/identity/logout
      SERVE_PUBLIC_HOST: 0.0.0.0
      SERVE_ADMIN_HOST: 0.0.0.0
      SERVE_PUBLIC_CORS_ENABLED: 'false'
      TTL_AUTH_CODE: 60s
      TTL_ACCESS_TOKEN: 60s
      TTL_ID_TOKEN: 60s
      LOG_LEAK_SENSITIVE_VALUES: 'false'
    ports: ['127.0.0.1:14444:4444']
  validate:
    profiles: [maintenance]
    image: ${WEBSITE_SERVER_IMAGE}
    working_dir: /workspace/website
    command: [node, scripts/runtime/deployment.mjs, validate]
    volumes:
      - type: bind
        source: ./.env.local
        target: /workspace/website/.env.local
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./.local/runtime-deployment
        target: /workspace/website/.local/runtime-deployment
        bind: { create_host_path: false }
  postgres:
    profiles: [managed-postgres]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ['deployment-pgdata:/var/lib/postgresql/data']
  redis:
    profiles: [managed-redis]
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: [redis-server, --appendonly, 'yes']
    volumes: ['deployment-redisdata:/data']
networks:
  default:
    name: exwebsite-deployment
volumes:
  website-avatars: { name: exwebsite-deployment-avatars }
  website-uploads: { name: exwebsite-deployment-uploads }
  website-upload-tmp: { name: exwebsite-deployment-upload-tmp }
  outline-attachments: { name: exwebsite-deployment-outline-attachments }
  deployment-pgdata: { name: exwebsite-deployment-pgdata }
  deployment-redisdata: { name: exwebsite-deployment-redisdata }
