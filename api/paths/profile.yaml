/auth/me:
  get:
    operationId: getCurrentUser
    summary: Read the authenticated user
    security:
      - bearerAuth: []
    tags: [authentication]
    responses:
      '200':
        description: Authenticated user
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CurrentUser'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
  patch:
    operationId: updateCurrentUser
    summary: Update the authenticated user's profile
    security:
      - bearerAuth: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateCurrentUserRequest'
    responses:
      '200':
        description: Updated user snapshot
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CurrentUser'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/me/avatar:
  post:
    operationId: uploadCurrentUserAvatar
    summary: Upload and replace the authenticated user's avatar
    security:
      - bearerAuth: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UploadAvatarRequest'
    responses:
      '200':
        description: Updated user snapshot
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CurrentUser'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '413':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/avatars/{avatarId}:
  get:
    operationId: getAvatarImage
    summary: Read a currently referenced public avatar image
    security: []
    tags: [authentication]
    parameters:
      - name: avatarId
        in: path
        required: true
        schema:
          $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier'
    responses:
      '200':
        description: WebP avatar bytes
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          image/webp:
            schema:
              type: string
              format: binary
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
