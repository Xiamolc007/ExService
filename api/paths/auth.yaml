/auth/captcha/challenges:
  post:
    operationId: createCaptchaChallenge
    summary: Reserve an image captcha challenge for authentication
    description: The Server returns a placeholder PNG during development and does not validate captcha submissions yet.
    security: []
    tags: [authentication]
    responses:
      '200':
        description: Image challenge placeholder
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CaptchaChallenge'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/login:
  post:
    operationId: login
    summary: Create a local session
    security: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Session created
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LoginResponse'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/logout:
  post:
    operationId: logout
    summary: Revoke the current local session
    security:
      - bearerAuth: []
    tags: [authentication]
    responses:
      '200':
        description: Session revoked
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LogoutResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/sso/inspect:
  post:
    operationId: inspectSsoRequest
    summary: Inspect a local SSO request
    security: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SsoRequestRef'
    responses:
      '200':
        description: SSO request state
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SsoRequestInfo'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '410':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/sso/login:
  post:
    operationId: loginForSso
    summary: Complete an SSO request with credentials
    security: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SsoPasswordRequest'
    responses:
      '200':
        description: SSO request completed
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SsoCompleted'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '410':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '503':
        $ref: '../openapi.yaml#/components/responses/RetryableErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
/auth/sso/confirm:
  post:
    operationId: confirmSsoWithSession
    summary: Complete an SSO request with the current session
    security:
      - bearerAuth: []
    tags: [authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SsoRequestRef'
    responses:
      '200':
        description: SSO request completed
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: '../openapi.yaml#/components/headers/CacheControl'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SsoCompleted'
      '400':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '401':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '404':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '409':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      '410':
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
