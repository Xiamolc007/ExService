/health:
  get:
    operationId: getHealth
    summary: Read server liveness
    security: []
    tags: [system]
    responses:
      '200':
        description: Server is running
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/HealthResponse'
      default:
        $ref: '../openapi.yaml#/components/responses/ErrorResponse'
