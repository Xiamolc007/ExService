      "400":
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
      default:
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
    parameters:
      - name: view
        in: query
        schema:
          type: string
          enum:
            - pending
            - all
          default: pending
      - name: limit
        in: query
        schema:
          type: string
          pattern: ^([1-9]|[1-4][0-9]|50)$
          default: "20"
      - name: offset
        in: query
        schema:
          type: string
          pattern: ^(0|[1-9][0-9]{0,8})$
          default: "0"
