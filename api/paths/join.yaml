/auth/invitations/check:
  post:
    operationId: checkInvitationEligibility
    summary: checkInvitationEligibility
    security: []
    tags:
      - authentication
    responses:
      "200":
        description: Successful operation
        headers:
          X-Request-Id:
            $ref: '../openapi.yaml#/components/headers/RequestId'
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/InvitationEligibility"
      "400":
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
      "404":
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
      "409":
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
      "429":
        $ref: "../openapi.yaml#/components/responses/RetryableErrorResponse"
      default:
        $ref: "../openapi.yaml#/components/responses/ErrorResponse"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvitationEligibilityRequest"
