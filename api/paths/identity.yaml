/auth/oidc/inspect:
  post:
    operationId: inspectOidcRequest
    summary: Inspect an approved Hydra login or consent challenge
    security: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OidcInspectRequest' }
    responses:
      '200':
        description: Approved client display information
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/OidcInspectResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '403': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/auth/oidc/login/accept:
  post:
    operationId: acceptOidcLogin
    summary: Accept a Hydra login challenge with the current Website session
    security:
      - bearerAuth: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OidcChallengeRequest' }
    responses:
      '200':
        description: Browser redirect to Hydra
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/OidcRedirectResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '403': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '409': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/auth/oidc/consent/accept:
  post:
    operationId: acceptOidcConsent
    summary: Accept preapproved OIDC scopes for the current Website session
    security:
      - bearerAuth: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OidcChallengeRequest' }
    responses:
      '200':
        description: Browser redirect to Hydra
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/OidcRedirectResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '403': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '409': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/auth/oidc/logout/accept:
  post:
    operationId: acceptOidcLogout
    summary: Revoke the linked browser session and accept its Hydra logout challenge
    security:
      - bearerAuth: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/OidcChallengeRequest' }
    responses:
      '200':
        description: Browser redirect to Hydra
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/OidcRedirectResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '403': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '409': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/internal/identity/session/check:
  post:
    operationId: checkLinkedSession
    summary: Check one client-bound Hydra session against the Website session
    security:
      - integrationKey: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/LinkedSessionRef' }
    responses:
      '200':
        description: Current linked session state
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/SessionCheckResult' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/internal/identity/session/revoke:
  post:
    operationId: revokeLinkedSession
    summary: Revoke one client-bound Website browser session
    security:
      - integrationKey: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/LinkedSessionRevokeRequest' }
    responses:
      '200':
        description: Session group is no longer valid
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/LinkedSessionRevokeResponse' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
/internal/identity/user/inspect:
  post:
    operationId: inspectIdentityUser
    summary: Inspect an active Website account during controlled bootstrap
    security:
      - bootstrapKey: []
    tags: [ identity ]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/IdentityUserRef' }
    responses:
      '200':
        description: Active account profile
        headers:
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/IdentityUserInfo' }
      '400': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '401': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '404': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      '503': { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
      default: { $ref: '../openapi.yaml#/components/responses/ErrorResponse' }
