openapi: 3.1.1
info:
  title: Backend Sandbox API
  version: 0.4.0
  description: |
    Frontend 与 Backend 之间的唯一 HTTP API Contract。

    该 Contract 同时供本地 Fastify Mock Server、TypeScript 客户端以及未来的 PHP
    生产实现使用。所有 schema 限定在 JSON Schema Draft-07 兼容子集内。
servers:
  - url: /api
    description: 客户端 API base URL；Fastify 仍通过 Glue 的 prefix 显式注册该前缀。
tags:
  - name: system
    description: Mock Server 自身运行状态。
  - name: authentication
    description: 本地账号、会话与 SSO 接收端能力。
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read mock server liveness
      security: []
      tags: [system]
      responses:
        '200':
          description: Mock server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/captcha/challenges:
    post:
      operationId: createCaptchaChallenge
      summary: Reserve an image captcha challenge for authentication
      description: The local Mock Server returns a placeholder PNG and does not validate captcha submissions yet.
      security: []
      tags: [authentication]
      responses:
        '200':
          description: Image challenge placeholder
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /join/applications:
    post:
      operationId: submitJoinApplication
      summary: submitJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "202":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationReceived"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinApplicationRequest"
  /admin/join/applications:
    get:
      operationId: listJoinApplications
      summary: listJoinApplications
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationList"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum:
              - pending
              - all
            default: pending
        - name: limit
          in: query
          schema:
            type: string
            pattern: ^([1-9]|[1-4][0-9]|50)$
            default: "20"
        - name: offset
          in: query
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,8})$
            default: "0"
  /admin/join/applications/{applicationId}:
    get:
      operationId: getJoinApplication
      summary: getJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/approve:
    post:
      operationId: approveJoinApplication
      summary: approveJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/reject:
    post:
      operationId: rejectJoinApplication
      summary: rejectJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/invitations:
    post:
      operationId: resendJoinInvitation
      summary: resendJoinInvitation
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /auth/invitations/check:
    post:
      operationId: checkInvitationEligibility
      summary: checkInvitationEligibility
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEligibility"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEligibilityRequest"
  /auth/invitations/code:
    post:
      operationId: requestInvitationCode
      summary: requestInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "202":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCodeRequest"
  /auth/invitations/verify:
    post:
      operationId: verifyInvitationCode
      summary: verifyInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationVerified"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationVerifyRequest"
  /auth/invitations/complete:
    post:
      operationId: completeInvitationRegistration
      summary: completeInvitationRegistration
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationRegistrationCompleted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCompleteRequest"
  /auth/login:
    post:
      operationId: login
      summary: Create a local session
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Authenticated user
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me/avatar:
    post:
      operationId: uploadCurrentUserAvatar
      summary: Upload and replace the authenticated user's avatar
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /avatars/{avatarId}:
    get:
      operationId: getAvatarImage
      summary: Read a currently referenced public avatar image
      security: []
      tags: [authentication]
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueIdentifier'
      responses:
        '200':
          description: WebP avatar bytes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current local session
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Session revoked
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/inspect:
    post:
      operationId: inspectSsoRequest
      summary: Inspect a local SSO request
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request state
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoRequestInfo'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/login:
    post:
      operationId: loginForSso
      summary: Complete an SSO request with credentials
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoPasswordRequest'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/confirm:
    post:
      operationId: confirmSsoWithSession
      summary: Complete an SSO request with the current session
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    CacheControl:
      description: Authentication responses are not cacheable.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole seconds before a retry is allowed.
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
  responses:
    ErrorResponse:
      description: Safe application error response
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RetryableErrorResponse:
      description: Safe application error response with a retry delay
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SafeTimestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    OpaqueIdentifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    Email:
      type: string
      minLength: 3
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: 服务端先 trim 再转为小写；按大小写不敏感处理。
    Nickname:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
      description: 界面称为用户名，仅作显示名称，允许重复，不用于登录。服务端 trim；业务层按 Unicode 码点限制为 1 至 32。
    Password:
      type: string
      minLength: 8
      maxLength: 64
      description: 不 trim、不归一化；业务层按 Unicode 码点限制为 8 至 64。
    VerificationCode:
      type: string
      pattern: '^[0-9]{6}$'
    CaptchaSubmission:
      type: object
      additionalProperties: false
      required: [challengeId, answer]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        answer: {type: string, minLength: 1, maxLength: 64}
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, imageBase64, expiresAt]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        imageBase64:
          type: string
          description: Base64-encoded PNG bytes, without a data URL prefix.
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    NullableUuid:
      type:
        - string
        - "null"
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    JoinReviewRequest:
      type: object
      additionalProperties: false
    JoinApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - nickname
        - qq
      properties:
        email:
          $ref: "#/components/schemas/Email"
        nickname:
          $ref: "#/components/schemas/Nickname"
        qq:
          type: string
          pattern: ^[0-9]{1,20}$
    JoinApplicationReceived:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: received
    InvitationEligibilityRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    InvitationCodeRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    InvitationEligibility:
      type: object
      additionalProperties: false
      required:
        - status
        - email
        - serverTime
        - resendAvailableAt
      properties:
        status:
          type: string
          const: eligible
        email:
          $ref: "#/components/schemas/Email"
        serverTime:
          $ref: "#/components/schemas/SafeTimestamp"
        resendAvailableAt:
          $ref: "#/components/schemas/SafeTimestamp"
    InvitationCodeAccepted:
      type: object
      additionalProperties: false
      required:
        - status
        - serverTime
        - resendAvailableAt
      properties:
        status:
          type: string
          const: accepted
        serverTime:
          $ref: "#/components/schemas/SafeTimestamp"
        resendAvailableAt:
          $ref: "#/components/schemas/SafeTimestamp"
    InvitationVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          $ref: "#/components/schemas/Email"
        code:
          $ref: "#/components/schemas/VerificationCode"
    InvitationVerified:
      type: object
      additionalProperties: false
      required:
        - status
        - completionToken
        - email
        - nickname
        - serverTime
        - completionExpiresAt
      properties:
        status:
          type: string
          const: verified
        completionToken:
          $ref: "#/components/schemas/OpaqueIdentifier"
        email:
          $ref: "#/components/schemas/Email"
        nickname:
          $ref: "#/components/schemas/Nickname"
        serverTime:
          $ref: "#/components/schemas/SafeTimestamp"
        completionExpiresAt:
          $ref: "#/components/schemas/SafeTimestamp"
    InvitationCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - completionToken
        - nickname
        - password
      properties:
        completionToken:
          $ref: "#/components/schemas/OpaqueIdentifier"
        nickname:
          $ref: "#/components/schemas/Nickname"
        password:
          $ref: "#/components/schemas/Password"
    InvitationRegistrationCompleted:
      type: object
      additionalProperties: false
      required:
        - status
        - email
      properties:
        status:
          type: string
          const: registered
        email:
          $ref: "#/components/schemas/Email"
    JoinApplicationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - nickname
        - qq
        - status
        - createdAt
        - reviewedAt
        - reviewedByUserId
        - invitationStatus
        - deliveryStatus
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          $ref: "#/components/schemas/Email"
        nickname:
          $ref: "#/components/schemas/Nickname"
        qq:
          type: string
          pattern: ^[0-9]{1,20}$
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          $ref: "#/components/schemas/SafeTimestamp"
        reviewedAt:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        reviewedByUserId:
          $ref: "#/components/schemas/NullableUuid"
        invitationStatus:
          type:
            - string
            - "null"
          enum:
            - active
            - expired
            - completed
            - null
        deliveryStatus:
          type:
            - string
            - "null"
          enum:
            - pending
            - sent
            - failed
            - null
    InvitationDeliverySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - startedAt
        - finishedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - pending
            - sent
            - failed
        startedAt:
          $ref: "#/components/schemas/SafeTimestamp"
        finishedAt:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
    InvitationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - issuedAt
        - expiresAt
        - codeExpiresAt
        - completedAt
        - completedUserId
        - resendAvailableAt
        - latestDelivery
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - active
            - expired
            - completed
        issuedAt:
          $ref: "#/components/schemas/SafeTimestamp"
        expiresAt:
          $ref: "#/components/schemas/SafeTimestamp"
        codeExpiresAt:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        completedAt:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 9007199254740991
        completedUserId:
          $ref: "#/components/schemas/NullableUuid"
        resendAvailableAt:
          $ref: "#/components/schemas/SafeTimestamp"
        latestDelivery:
          anyOf:
            - $ref: "#/components/schemas/InvitationDeliverySummary"
            - type: "null"
    JoinApplicationDetail:
      type: object
      additionalProperties: false
      required:
        - application
        - invitation
        - serverTime
      properties:
        application:
          $ref: "#/components/schemas/JoinApplicationSummary"
        invitation:
          anyOf:
            - $ref: "#/components/schemas/InvitationSummary"
            - type: "null"
        serverTime:
          $ref: "#/components/schemas/SafeTimestamp"
    JoinApplicationList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - offset
        - limit
        - serverTime
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JoinApplicationSummary"
        total:
          $ref: "#/components/schemas/SafeTimestamp"
        offset:
          $ref: "#/components/schemas/SafeTimestamp"
        limit:
          type: integer
          minimum: 1
          maximum: 50
        serverTime:
          $ref: "#/components/schemas/SafeTimestamp"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {$ref: '#/components/schemas/Email'}
        password: {$ref: '#/components/schemas/Password'}
        captcha: {$ref: '#/components/schemas/CaptchaSubmission'}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: {$ref: '#/components/schemas/OpaqueIdentifier'}
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, nickname]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        email: {$ref: '#/components/schemas/Email'}
        nickname: {$ref: '#/components/schemas/Nickname'}
        qq:
          type: [string, 'null']
          pattern: '^[0-9]{1,20}$'
        fivemId:
          type: [string, 'null']
          pattern: '^fivem:[0-9]+$'
          maxLength: 64
        avatarUrl:
          type: [string, 'null']
          format: uri
    UpdateCurrentUserRequest:
      type: object
      additionalProperties: false
      properties:
        nickname: {$ref: '#/components/schemas/Nickname'}
        qq:
          type: [string, 'null']
          pattern: '^[0-9]{1,20}$'
        fivemId:
          type: [string, 'null']
          pattern: '^fivem:[0-9]+$'
          maxLength: 64
        avatar:
          type: 'null'
          description: Clear the current avatar reference.
    UploadAvatarRequest:
      type: object
      additionalProperties: false
      required: [imageBase64, mediaType]
      properties:
        imageBase64:
          type: string
          minLength: 1
          description: Base64-encoded image bytes, without a data URL prefix.
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: signed-out}
    SsoRequestRef:
      type: object
      additionalProperties: false
      required: [ssoRequestId]
      properties:
        ssoRequestId: {$ref: '#/components/schemas/OpaqueIdentifier'}
    SsoPasswordRequest:
      type: object
      additionalProperties: false
      required: [ssoRequestId, email, password]
      properties:
        ssoRequestId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        email: {$ref: '#/components/schemas/Email'}
        password: {$ref: '#/components/schemas/Password'}
        captcha: {$ref: '#/components/schemas/CaptchaSubmission'}
    SsoRequestInfo:
      type: object
      additionalProperties: false
      required: [ssoRequestId, status, expiresAt, serverTime]
      properties:
        ssoRequestId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        status: {type: string, enum: [pending, completed]}
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
        serverTime: {$ref: '#/components/schemas/SafeTimestamp'}
    SsoCompleted:
      type: object
      additionalProperties: false
      required: [status, ssoRequestId]
      properties:
        status: {type: string, const: completed}
        ssoRequestId: {$ref: '#/components/schemas/OpaqueIdentifier'}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
