openapi: 3.1.1
info:
  title: ExWebsite Server API
  version: 0.5.0
  description: |
    Frontend 与 Backend 之间的唯一 HTTP API Contract。

    该 Contract 由本仓库唯一的 Fastify Server 和 TypeScript 客户端共同使用。
    所有 schema 限定在 JSON Schema Draft-07 兼容子集内。
servers:
  - url: /api
    description: 客户端 API base URL；Fastify 仍通过 Glue 的 prefix 显式注册该前缀。
tags:
  - name: system
    description: Server 自身运行状态。
  - name: authentication
    description: 本地账号、会话与 SSO 接收端能力。
  - name: identity
    description: Hydra 登录确认与受控服务间会话核验。
  - name: storage
    description: 通用内容存储的上传、直传确认与本地公开读取。
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read server liveness
      security: []
      tags: [system]
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/captcha/challenges:
    post:
      operationId: createCaptchaChallenge
      summary: Reserve an image captcha challenge for authentication
      description: The Server returns a placeholder PNG during development and does not validate captcha submissions yet.
      security: []
      tags: [authentication]
      responses:
        '200':
          description: Image challenge placeholder
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /join/applications:
    post:
      operationId: submitJoinApplication
      summary: Submit one complete join application
      description: Exactly one application JSON part; new players cannot attach proofs. Each proof carries its raw file bytes in a separate multipart part with the same proofs field name, without percent encoding. Proof parts retain their supplied media type; the server validates extension and byte signatures independently of that media type. One normalized email may apply only once across all histories and categories. Existing history returns 409 JOIN_APPLICATION_EXISTS before account-only EMAIL_IN_USE. Validation and atomic persistence complete before success. All responses use no-store.
      security: []
      tags:
        - authentication
      x-fastify-config:
        joinUpload:
          wireBytes: 67108864
          jsonBytes: 65536
          fileBytes: 10485760
          totalFileBytes: 52428800
          proofs: 5
          parts: 6
          fieldNameBytes: 64
          headerPairs: 32
          headerBytes: 16384
          slots: 2
          deadlineMs: 120000
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/JoinApplicationRequest"
            encoding:
              application:
                contentType: application/json
              proofs:
                contentType: '*/*'
      responses:
        "202":
          description: Successful operation; not cacheable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationReceived"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "408":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /join/applications/query:
    post:
      operationId: queryJoinApplicationResult
      summary: Read the minimal join application result
      description: Read-only snapshot; six closed status/nextAction pairs, no email or personal information. Missing applications return 200 not_found, including account-only legacy users. A completed invitation with an existing user wins over newer history; otherwise use createdAt DESC, id DESC and latest invitation issuedAt DESC, id DESC. Expiry calculation never writes business state. All responses use no-store.
      security: []
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinApplicationQueryRequest"
      responses:
        "200":
          description: Successful operation; not cacheable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /admin/join/applications:
    get:
      operationId: listJoinApplications
      summary: listJoinApplications
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationList"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum:
              - pending
              - all
            default: pending
        - name: limit
          in: query
          schema:
            type: string
            pattern: ^([1-9]|[1-4][0-9]|50)$
            default: "20"
        - name: offset
          in: query
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,8})$
            default: "0"
  /admin/join/applications/{applicationId}:
    get:
      operationId: getJoinApplication
      summary: getJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/approve:
    post:
      operationId: approveJoinApplication
      summary: approveJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/reject:
    post:
      operationId: rejectJoinApplication
      summary: rejectJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/invitations:
    post:
      operationId: resendJoinInvitation
      summary: resendJoinInvitation
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/attachments/{attachmentId}:
    get:
      operationId: downloadJoinApplicationAttachment
      summary: Download an application proof attachment
      description: "Development review access only. Missing or mismatched application/attachment pairs return 404 JOIN_ATTACHMENT_NOT_FOUND. Always download; never preview. Two response slots are acquired before attachment reads; capacity failure is 503 and Retry-After: 5. A 60 second response deadline terminates started connections without a second JSON response. All responses use no-store."
      security: []
      tags:
        - authentication
      x-fastify-config:
        joinDownload:
          slots: 2
          deadlineMs: 60000
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: attachmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Original attachment bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              description: attachment; safe ASCII filename fallback and UTF-8 filename*.
              required: true
              schema:
                type: string
                pattern: ^attachment;
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
  /auth/invitations/check:
    post:
      operationId: checkInvitationEligibility
      summary: checkInvitationEligibility
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEligibility"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEligibilityRequest"
  /auth/invitations/code:
    post:
      operationId: requestInvitationCode
      summary: requestInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "202":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCodeRequest"
  /auth/invitations/verify:
    post:
      operationId: verifyInvitationCode
      summary: verifyInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationVerified"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationVerifyRequest"
  /auth/invitations/complete:
    post:
      operationId: completeInvitationRegistration
      summary: completeInvitationRegistration
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationRegistrationCompleted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCompleteRequest"
  /auth/login:
    post:
      operationId: login
      summary: Create a local session
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Authenticated user
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me/avatar:
    post:
      operationId: uploadCurrentUserAvatar
      summary: Upload and replace the authenticated user's avatar
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /avatars/{avatarId}:
    get:
      operationId: getAvatarImage
      summary: Read a currently referenced public avatar image
      security: []
      tags: [authentication]
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueIdentifier'
      responses:
        '200':
          description: WebP avatar bytes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current local session
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Session revoked
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/inspect:
    post:
      operationId: inspectSsoRequest
      summary: Inspect a local SSO request
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request state
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoRequestInfo'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/login:
    post:
      operationId: loginForSso
      summary: Complete an SSO request with credentials
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoPasswordRequest'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/confirm:
    post:
      operationId: confirmSsoWithSession
      summary: Complete an SSO request with the current session
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/oidc/inspect:
    post:
      operationId: inspectOidcRequest
      summary: Inspect an approved Hydra login or consent challenge
      security: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcInspectRequest'}
      responses:
        '200':
          description: Approved client display information
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcInspectResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/oidc/login/accept:
    post:
      operationId: acceptOidcLogin
      summary: Accept a Hydra login challenge with the current Website session
      security:
        - bearerAuth: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcChallengeRequest'}
      responses:
        '200':
          description: Browser redirect to Hydra
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcRedirectResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/oidc/consent/accept:
    post:
      operationId: acceptOidcConsent
      summary: Accept preapproved OIDC scopes for the current Website session
      security:
        - bearerAuth: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcChallengeRequest'}
      responses:
        '200':
          description: Browser redirect to Hydra
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcRedirectResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/oidc/logout/accept:
    post:
      operationId: acceptOidcLogout
      summary: Revoke the linked browser session and accept its Hydra logout challenge
      security:
        - bearerAuth: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcChallengeRequest'}
      responses:
        '200':
          description: Browser redirect to Hydra
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcRedirectResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '409': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /internal/identity/session/check:
    post:
      operationId: checkLinkedSession
      summary: Check one client-bound Hydra session against the Website session
      security:
        - integrationKey: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkedSessionRef'}
      responses:
        '200':
          description: Current linked session state
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionCheckResult'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /internal/identity/session/revoke:
    post:
      operationId: revokeLinkedSession
      summary: Revoke one client-bound Website browser session
      security:
        - integrationKey: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkedSessionRevokeRequest'}
      responses:
        '200':
          description: Session group is no longer valid
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkedSessionRevokeResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /internal/identity/user/inspect:
    post:
      operationId: inspectIdentityUser
      summary: Inspect an active Website account during controlled bootstrap
      security:
        - bootstrapKey: []
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityUserRef'}
      responses:
        '200':
          description: Active account profile
          headers:
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityUserInfo'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '503': {$ref: '#/components/responses/ErrorResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /storage/uploads/prepare:
    post:
      operationId: prepareStorageUpload
      summary: Resolve the upload plan for one storage key
      description: Server selects the medium for this call from runtime configuration unless the caller pins medium. The file branch only returns the current byte ceiling. The cos branch validates configuration, key, declared size and media type before requesting scoped STS credentials and signing the upload ticket, and returns no partial credentials when any step fails. Credentials authorize exactly one key for PutObject. All responses use no-store.
      security:
        - bearerAuth: []
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareStorageUploadRequest'
      responses:
        '200':
          description: Upload plan for the resolved medium
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareStorageUploadResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/uploads:
    post:
      operationId: uploadStorageContent
      summary: Upload content through the server and return its URL
      description: Multipart with exactly one binary data part plus keyword text fields in any order. Repeated fields, unknown fields, more than one file, a missing data part, an invalid media type and a non-multipart request are rejected. An explicit contentType wins, otherwise the part media type is used, otherwise application/octet-stream. The filename never selects the stored path. Bearer authentication completes before any content is consumed. Byte and wire ceilings are enforced while parsing, not from the supplied Content-Length. Two failures answer 503 — exhausted upload slots (STORAGE_BUSY) carries Retry-After, a requested medium that is not enabled (STORAGE_UNAVAILABLE) does not. All responses use no-store.
      security:
        - bearerAuth: []
      tags: [storage]
      x-fastify-config:
        storageUpload:
          wireOverheadBytes: 65536
          fieldBytes: 512
          fields: 3
          files: 1
          fieldNameBytes: 32
          headerPairs: 32
          headerBytes: 16384
          slots: 2
          deadlineMs: 120000
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StorageUploadRequest'
            encoding:
              data:
                contentType: '*/*'
      responses:
        '200':
          description: Stored content URL
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUploadResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '408':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/uploads/complete:
    post:
      operationId: completeStorageUpload
      summary: Confirm a direct cos upload and issue its URL
      description: Verifies the ticket length and structure, the fixed HMAC algorithm, the signature, the version and validity window, the current session user, the key against the current bucket and region, and the current size ceiling before querying the object. Never issues a request from a region or bucket taken from an unverified ticket. A size above the ceiling returns 413 and a different size than declared returns 409. The client cannot submit a bucket, download host, URL or existence flag. All responses use no-store.
      security:
        - bearerAuth: []
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStorageUploadRequest'
      responses:
        '200':
          description: Stored content URL
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageUploadResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /storage/files:
    get:
      operationId: getStoredFile
      summary: Read one object from the local file medium
      description: Public read of the local uploads root only. Directories are never returned as files. Range is unsupported in this version and a Range request still returns the full 200 body. Bytes are sent as application/octet-stream with attachment disposition and MIME sniffing disabled. Failures before the headers are flushed return the error envelope; a failure afterwards terminates the connection instead of appending JSON. The implicit HEAD route stays closed because the contract does not declare it.
      security: []
      tags: [storage]
      x-fastify-config:
        storageDownload:
          deadlineMs: 120000
      parameters:
        - name: key
          in: query
          required: true
          description: Relative storage path previously used for the upload.
          schema:
            $ref: '#/components/schemas/StorageKey'
      responses:
        '200':
          description: Stored object bytes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '408':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    integrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
    bootstrapKey:
      type: apiKey
      in: header
      name: X-Bootstrap-Key
  headers:
    CacheControl:
      description: Authentication responses are not cacheable.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole seconds before a retry is allowed.
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    ContentDisposition:
      description: Always attachment; the filename is the last validated key segment, encoded as a quoted-string.
      schema:
        type: string
    ContentTypeOptions:
      description: Disables MIME sniffing so stored bytes are never rendered inline.
      schema:
        type: string
        const: nosniff
  responses:
    ErrorResponse:
      description: Safe application error response
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RetryableErrorResponse:
      description: Safe application error response with a retry delay
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    OidcChallenge:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: '^\S+$'
    OidcInspectRequest:
      type: object
      additionalProperties: false
      required: [phase, challenge]
      properties:
        phase: {type: string, enum: [login, consent]}
        challenge: {$ref: '#/components/schemas/OidcChallenge'}
    OidcInspectResponse:
      type: object
      additionalProperties: false
      required: [clientName, scopes]
      properties:
        clientName: {type: string}
        scopes:
          type: array
          items: {type: string}
    OidcChallengeRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: {$ref: '#/components/schemas/OidcChallenge'}
    OidcRedirectResponse:
      type: object
      additionalProperties: false
      required: [redirectUrl]
      properties:
        redirectUrl: {type: string, minLength: 1}
    LinkedSessionRef:
      type: object
      additionalProperties: false
      required: [hydraSid, subject]
      properties:
        hydraSid: {type: string, minLength: 1, maxLength: 255}
        subject: {$ref: '#/components/schemas/Uuid'}
    LinkedSessionRevokeRequest:
      type: object
      additionalProperties: false
      required: [hydraSid, subject, requestId]
      properties:
        hydraSid: {type: string, minLength: 1, maxLength: 255}
        subject: {$ref: '#/components/schemas/Uuid'}
        requestId: {$ref: '#/components/schemas/Uuid'}
    LinkedSessionRevokeResponse:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: {type: boolean, const: true}
    SessionCheckResult:
      oneOf:
        - $ref: '#/components/schemas/ActiveLinkedSession'
        - $ref: '#/components/schemas/InactiveLinkedSession'
    ActiveLinkedSession:
      type: object
      additionalProperties: false
      required: [active, sessionId, userId, expiresAt, profile]
      properties:
        active: {type: boolean, const: true}
        sessionId: {$ref: '#/components/schemas/Uuid'}
        userId: {$ref: '#/components/schemas/Uuid'}
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
        profile:
          type: object
          additionalProperties: false
          required: [nickname, email, avatarUrl, version]
          properties:
            nickname: {$ref: '#/components/schemas/Nickname'}
            email: {$ref: '#/components/schemas/Email'}
            avatarUrl: {type: [string, 'null']}
            version: {type: integer, minimum: 0}
    InactiveLinkedSession:
      type: object
      additionalProperties: false
      required: [active, reason]
      properties:
        active: {type: boolean, const: false}
        reason: {type: string, enum: [unknown, revoked, expired, disabled]}
    IdentityUserRef:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: {$ref: '#/components/schemas/Uuid'}
    IdentityUserInfo:
      type: object
      additionalProperties: false
      required: [id, nickname, email, avatarUrl, profileVersion]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        nickname: {$ref: '#/components/schemas/Nickname'}
        email: {$ref: '#/components/schemas/Email'}
        avatarUrl: {type: [string, 'null']}
        profileVersion: {type: integer, minimum: 0}
    SafeTimestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    OpaqueIdentifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    Email:
      type: string
      minLength: 3
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: 服务端先 trim 再转为小写；按大小写不敏感处理。
    Nickname:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
      description: 界面称为用户名，仅作显示名称，允许重复，不用于登录。服务端 trim；业务层按 Unicode 码点限制为 1 至 32。
    Password:
      type: string
      minLength: 8
      maxLength: 64
      description: 不 trim、不归一化；业务层按 Unicode 码点限制为 8 至 64。
    VerificationCode:
      type: string
      pattern: '^[0-9]{6}$'
    CaptchaSubmission:
      type: object
      additionalProperties: false
      required: [challengeId, answer]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        answer: {type: string, minLength: 1, maxLength: 64}
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, imageBase64, expiresAt]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        imageBase64:
          type: string
          description: Base64-encoded PNG bytes, without a data URL prefix.
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    NullableUuid:
      type:
        - string
        - "null"
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    JoinReviewRequest:
      type: object
      additionalProperties: false
    JoinApplicationRequest:
      description: "Only multipart: exactly one application/json part (application.json, at most 64 KiB), optional proofs. Unknown parts, duplicate application, truncation and forged markers are rejected; application and all bytes commit atomically."
      oneOf:
        - $ref: "#/components/schemas/JoinNewApplicationRequest"
        - $ref: "#/components/schemas/JoinExperiencedApplicationRequest"
    JoinApplicationQq:
      type: string
      pattern: ^[0-9]{5,13}$
      description: New application QQ; preserve leading zeroes. Account and legacy summary QQ retain 1?20 digits.
    JoinNewAnswers:
      type: object
      additionalProperties: false
      required:
        - fiveMExperience
        - emergencyRoleplayKnowledge
        - emergencyProceduresKnowledge
        - rpUnderstanding
        - frpUnderstanding
      properties:
        fiveMExperience:
          type: string
          minLength: 1
          maxLength: 4000
        emergencyRoleplayKnowledge:
          type: string
          minLength: 1
          maxLength: 4000
        emergencyProceduresKnowledge:
          type: string
          minLength: 1
          maxLength: 4000
        rpUnderstanding:
          type: string
          minLength: 1
          maxLength: 4000
        frpUnderstanding:
          type: string
          minLength: 1
          maxLength: 4000
    JoinExperiencedAnswers:
      type: object
      additionalProperties: false
      required:
        - previousServer
        - leaveReason
        - previousDepartment
        - lawEnforcementExperience
        - highestRank
        - punishmentHistory
        - deescalationEssay
        - discretionEssay
        - transferReason
      properties:
        previousServer:
          type: string
          minLength: 1
          maxLength: 256
        leaveReason:
          type: string
          minLength: 1
          maxLength: 4000
        previousDepartment:
          type: string
          minLength: 1
          maxLength: 256
        lawEnforcementExperience:
          type: string
          minLength: 1
          maxLength: 4000
        highestRank:
          type: string
          minLength: 1
          maxLength: 256
        punishmentHistory:
          type: string
          minLength: 1
          maxLength: 4000
        deescalationEssay:
          type: string
          minLength: 150
          maxLength: 4000
        discretionEssay:
          type: string
          minLength: 150
          maxLength: 4000
        transferReason:
          type: string
          minLength: 1
          maxLength: 4000
    JoinNewCommitments:
      type: object
      additionalProperties: false
      required:
        - informationAccurate
        - obeyCommunityRules
        - acceptAcademyAttendanceConsequences
      properties:
        informationAccurate:
          type: boolean
          const: true
        obeyCommunityRules:
          type: boolean
          const: true
        acceptAcademyAttendanceConsequences:
          type: boolean
          const: true
    JoinExperiencedCommitments:
      type: object
      additionalProperties: false
      required:
        - informationAccurate
      properties:
        informationAccurate:
          type: boolean
          const: true
        obeyCommunityRules:
          type: boolean
          const: true
          description: Present on applications submitted by the current form; optional for previously stored version 1 forms.
    JoinNewForm:
      type: object
      additionalProperties: false
      required:
        - applicationType
        - birthDate
        - applicantCategory
        - department
        - freeTime
        - discoveryChannels
        - answers
        - commitments
      properties:
        applicationType:
          type: string
          const: new
        birthDate: &a1
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Valid Gregorian YYYY-MM-DD date no later than server UTC today; never a timestamp.
        applicantCategory: &a2
          type: string
          enum:
            - "100"
            - "101"
            - 102a
            - 102b
        department: &a3
          type: string
          enum:
            - leo
            - ems
        freeTime: &a4
          type: string
          minLength: 1
          maxLength: 256
          description: Selected option or actual free text; trim before Unicode code point counting.
        discoveryChannels: &a5
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - bilibili
              - douyin
              - friends
              - other
        answers:
          $ref: "#/components/schemas/JoinNewAnswers"
        commitments:
          $ref: "#/components/schemas/JoinNewCommitments"
      description: Answer and freeTime strings are trimmed then counted as Unicode code points. The server independently checks calendar and text semantics.
    JoinNewApplicationPayload:
      type: object
      additionalProperties: false
      required:
        - email
        - nickname
        - qq
        - form
      properties:
        email:
          $ref: "#/components/schemas/Email"
        nickname:
          $ref: "#/components/schemas/Nickname"
        qq:
          $ref: "#/components/schemas/JoinApplicationQq"
        form:
          $ref: "#/components/schemas/JoinNewForm"
    JoinNewApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - application
      properties:
        application:
          $ref: "#/components/schemas/JoinNewApplicationPayload"
        proofs:
          type: array
          maxItems: 0
          items:
            type: string
            format: binary
          description: Repeated same-name parts; private raw files must pair one-to-one with validated body markers.
    JoinExperiencedForm:
      type: object
      additionalProperties: false
      required:
        - applicationType
        - birthDate
        - applicantCategory
        - department
        - freeTime
        - discoveryChannels
        - answers
        - commitments
      properties:
        applicationType:
          type: string
          const: experienced
        birthDate: *a1
        applicantCategory: *a2
        department: *a3
        freeTime: *a4
        discoveryChannels: *a5
        answers:
          $ref: "#/components/schemas/JoinExperiencedAnswers"
        commitments:
          $ref: "#/components/schemas/JoinExperiencedCommitments"
      description: Answer and freeTime strings are trimmed then counted as Unicode code points. The server independently checks calendar and text semantics.
    JoinExperiencedApplicationPayload:
      type: object
      additionalProperties: false
      required:
        - email
        - nickname
        - qq
        - form
      properties:
        email:
          $ref: "#/components/schemas/Email"
        nickname:
          $ref: "#/components/schemas/Nickname"
        qq:
          $ref: "#/components/schemas/JoinApplicationQq"
        form:
          $ref: "#/components/schemas/JoinExperiencedForm"
    JoinExperiencedApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - application
      properties:
        application:
          $ref: "#/components/schemas/JoinExperiencedApplicationPayload"
        proofs:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary
          description: Repeated same-name parts; private raw files must pair one-to-one with validated body markers.
    JoinApplicationPayload:
      oneOf:
        - $ref: "#/components/schemas/JoinNewApplicationPayload"
        - $ref: "#/components/schemas/JoinExperiencedApplicationPayload"
    JoinApplicationQueryRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/Email"
    JoinApplicationResult:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: not_found
            nextAction:
              type: string
              const: apply
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: pending
            nextAction:
              type: string
              const: wait
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: approved
            nextAction:
              type: string
              const: register
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: rejected
            nextAction:
              type: string
              const: contact_community
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: invitation_expired
            nextAction:
              type: string
              const: contact_community
        - type: object
          additionalProperties: false
          required:
            - status
            - nextAction
          properties:
            status:
              type: string
              const: registered
            nextAction:
              type: string
              const: login
    JoinApplicationAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - originalName
        - extension
        - byteLength
        - sha256
        - ordinal
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        originalName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^\\/\u0000-\u001F\u007F-\u009F]+$
          description: Safe basename; reject path separators, controls, dot directory names and header injection characters.
        extension:
          type: string
          enum:
            - png
            - jpg
            - jpeg
            - gif
            - bmp
            - svg
            - pdf
            - doc
            - docx
            - xls
            - xlsx
            - ppt
            - pptx
            - txt
            - zip
            - rar
            - 7z
        byteLength:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        ordinal:
          type: integer
          minimum: 0
          maximum: 4
    JoinNewApplicationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - nickname
        - qq
        - status
        - createdAt
        - reviewedAt
        - reviewedByUserId
        - invitationStatus
        - deliveryStatus
