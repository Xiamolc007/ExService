openapi: 3.1.1
info:
  title: ExWebsite Server API
  version: 0.5.0
  description: |
    Frontend 与 Backend 之间的唯一 HTTP API Contract。

    该 Contract 由本仓库唯一的 Fastify Server 和 TypeScript 客户端共同使用。
    所有 schema 限定在 JSON Schema Draft-07 兼容子集内。
servers:
  - url: /api
    description: 客户端 API base URL；Fastify 仍通过 Glue 的 prefix 显式注册该前缀。
tags:
  - name: system
    description: Server 自身运行状态。
  - name: authentication
    description: 本地账号、会话与 SSO 接收端能力。
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read server liveness
      security: []
      tags: [system]
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/captcha/challenges:
    post:
      operationId: createCaptchaChallenge
      summary: Reserve an image captcha challenge for authentication
      description: The Server returns a placeholder PNG during development and does not validate captcha submissions yet.
      security: []
      tags: [authentication]
      responses:
        '200':
          description: Image challenge placeholder
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /join/applications:
    post:
      operationId: submitJoinApplication
      summary: Submit one complete join application
      description: Exactly one application JSON part; new players cannot attach proofs. Each proof carries its raw file bytes in a separate multipart part with the same proofs field name, without percent encoding. Proof parts retain their supplied media type; the server validates extension and byte signatures independently of that media type. One normalized email may apply only once across all histories and categories. Existing history returns 409 JOIN_APPLICATION_EXISTS before account-only EMAIL_IN_USE. Validation and atomic persistence complete before success. All responses use no-store.
      security: []
      tags:
        - authentication
      x-fastify-config:
        joinUpload:
          wireBytes: 67108864
          jsonBytes: 65536
          fileBytes: 10485760
          totalFileBytes: 52428800
          proofs: 5
          parts: 6
          fieldNameBytes: 64
          headerPairs: 32
          headerBytes: 16384
          slots: 2
          deadlineMs: 120000
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/JoinApplicationRequest"
            encoding:
              application:
                contentType: application/json
              proofs:
                contentType: '*/*'
      responses:
        "202":
          description: Successful operation; not cacheable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationReceived"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "408":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /join/applications/query:
    post:
      operationId: queryJoinApplicationResult
      summary: Read the minimal join application result
      description: Read-only snapshot; six closed status/nextAction pairs, no email or personal information. Missing applications return 200 not_found, including account-only legacy users. A completed invitation with an existing user wins over newer history; otherwise use createdAt DESC, id DESC and latest invitation issuedAt DESC, id DESC. Expiry calculation never writes business state. All responses use no-store.
      security: []
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinApplicationQueryRequest"
      responses:
        "200":
          description: Successful operation; not cacheable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /admin/join/applications:
    get:
      operationId: listJoinApplications
      summary: listJoinApplications
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationList"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum:
              - pending
              - all
            default: pending
        - name: limit
          in: query
          schema:
            type: string
            pattern: ^([1-9]|[1-4][0-9]|50)$
            default: "20"
        - name: offset
          in: query
          schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,8})$
            default: "0"
  /admin/join/applications/{applicationId}:
    get:
      operationId: getJoinApplication
      summary: getJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/approve:
    post:
      operationId: approveJoinApplication
      summary: approveJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/reject:
    post:
      operationId: rejectJoinApplication
      summary: rejectJoinApplication
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/invitations:
    post:
      operationId: resendJoinInvitation
      summary: resendJoinInvitation
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinApplicationDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinReviewRequest"
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
  /admin/join/applications/{applicationId}/attachments/{attachmentId}:
    get:
      operationId: downloadJoinApplicationAttachment
      summary: Download an application proof attachment
      description: "Development review access only. Missing or mismatched application/attachment pairs return 404 JOIN_ATTACHMENT_NOT_FOUND. Always download; never preview. Two response slots are acquired before attachment reads; capacity failure is 503 and Retry-After: 5. A 60 second response deadline terminates started connections without a second JSON response. All responses use no-store."
      security: []
      tags:
        - authentication
      x-fastify-config:
        joinDownload:
          slots: 2
          deadlineMs: 60000
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: attachmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Original attachment bytes.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Content-Disposition:
              description: attachment; safe ASCII filename fallback and UTF-8 filename*.
              required: true
              schema:
                type: string
                pattern: ^attachment;
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
  /auth/invitations/check:
    post:
      operationId: checkInvitationEligibility
      summary: checkInvitationEligibility
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEligibility"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationEligibilityRequest"
  /auth/invitations/code:
    post:
      operationId: requestInvitationCode
      summary: requestInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "202":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCodeAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCodeRequest"
  /auth/invitations/verify:
    post:
      operationId: verifyInvitationCode
      summary: verifyInvitationCode
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationVerified"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationVerifyRequest"
  /auth/invitations/complete:
    post:
      operationId: completeInvitationRegistration
      summary: completeInvitationRegistration
      security: []
      tags:
        - authentication
      responses:
        "200":
          description: Successful operation
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationRegistrationCompleted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/RetryableErrorResponse"
        "503":
          $ref: "#/components/responses/RetryableErrorResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCompleteRequest"
  /auth/login:
    post:
      operationId: login
      summary: Create a local session
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Authenticated user
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me/avatar:
    post:
      operationId: uploadCurrentUserAvatar
      summary: Upload and replace the authenticated user's avatar
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarRequest'
      responses:
        '200':
          description: Updated user snapshot
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /avatars/{avatarId}:
    get:
      operationId: getAvatarImage
      summary: Read a currently referenced public avatar image
      security: []
      tags: [authentication]
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueIdentifier'
      responses:
        '200':
          description: WebP avatar bytes
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current local session
      security:
        - bearerAuth: []
      tags: [authentication]
      responses:
        '200':
          description: Session revoked
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/inspect:
    post:
      operationId: inspectSsoRequest
      summary: Inspect a local SSO request
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request state
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoRequestInfo'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/login:
    post:
      operationId: loginForSso
      summary: Complete an SSO request with credentials
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoPasswordRequest'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/RetryableErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/sso/confirm:
    post:
      operationId: confirmSsoWithSession
      summary: Complete an SSO request with the current session
      security:
        - bearerAuth: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoRequestRef'
      responses:
        '200':
          description: SSO request completed
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoCompleted'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '410':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    CacheControl:
      description: Authentication responses are not cacheable.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole seconds before a retry is allowed.
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
  responses:
    ErrorResponse:
      description: Safe application error response
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RetryableErrorResponse:
      description: Safe application error response with a retry delay
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SafeTimestamp:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    OpaqueIdentifier:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    Email:
      type: string
      minLength: 3
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: 服务端先 trim 再转为小写；按大小写不敏感处理。
    Nickname:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
      description: 界面称为用户名，仅作显示名称，允许重复，不用于登录。服务端 trim；业务层按 Unicode 码点限制为 1 至 32。
    Password:
      type: string
      minLength: 8
      maxLength: 64
      description: 不 trim、不归一化；业务层按 Unicode 码点限制为 8 至 64。
    VerificationCode:
      type: string
      pattern: '^[0-9]{6}$'
    CaptchaSubmission:
      type: object
      additionalProperties: false
      required: [challengeId, answer]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        answer: {type: string, minLength: 1, maxLength: 64}
    CaptchaChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, imageBase64, expiresAt]
      properties:
        challengeId: {$ref: '#/components/schemas/OpaqueIdentifier'}
        imageBase64:
          type: string
          description: Base64-encoded PNG bytes, without a data URL prefix.
        expiresAt: {$ref: '#/components/schemas/SafeTimestamp'}
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    NullableUuid:
      type:
        - string
        - "null"
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    JoinReviewRequest:
      type: object
      additionalProperties: false
    JoinApplicationRequest:
      description: "Only multipart: exactly one application/json part (application.json, at most 64 KiB), optional proofs. Unknown parts, duplicate application, truncation and forged markers are rejected; application and all bytes commit atomically."
      oneOf:
        - $ref: "#/components/schemas/JoinNewApplicationRequest"
        - $ref: "#/components/schemas/JoinExperiencedApplicationRequest"
    JoinApplicationQq:
      type: string
      pattern: ^[0-9]{5,13}$
      description: New application QQ; preserve leading zeroes. Account and legacy summary QQ retain 1?20 digits.
