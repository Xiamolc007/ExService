    SsoCompleted:
      type: object
      additionalProperties: false
      required: [status, ssoRequestId]
      properties:
        status: {type: string, const: completed}
        ssoRequestId: {$ref: '#/components/schemas/OpaqueIdentifier'}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    StorageKey:
      type: string
      minLength: 1
      maxLength: 240
      pattern: '^[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?(?:/[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?)*$'
      description: 相对存储路径，以 `/` 分段；每段只含小写字母、数字、点、下划线与连字符，段首为字母或数字且段尾不得为点。服务端另外逐段拒绝 Windows 保留设备名，并核对解析路径仍位于 uploads 根目录内；不清洗、不自动小写、不二次 URL 解码。
    StorageMedium:
      type: string
      enum: [file, cos]
      description: 目标存储介质；缺省时取运行时配置 STORAGE_DEFAULT_ADAPTER，不回退。
    StorageContentType:
      type: string
      minLength: 1
      maxLength: 127
      pattern: "^[A-Za-z0-9!#$%&'*+.^_`|~-]+/[A-Za-z0-9!#$%&'*+.^_`|~-]+$"
      description: 无参数的 ASCII `type/subtype` 内容声明。服务端不据此验证真实文件格式，也不按后缀推断类型。
    StorageByteSize:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: 字节数；上界是 JS 安全整数，实际仍另受运行时 STORAGE_MAX_BYTES 限制。
    StorageUnixSeconds:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Unix 秒时间戳；与 SafeTimestamp 取值域相同，仅单位与语义不同。
    StorageUploadTicket:
      type: string
      minLength: 1
      maxLength: 4096
      description: 服务器用独立 HMAC 密钥签发的无状态上传凭据，绑定版本、用户、bucket、region、key、申报大小、内容类型与有效期。不写入日志，不缓存。
    StorageUploadCredential:
      type: object
      additionalProperties: false
      required: [tmpSecretId, tmpSecretKey, securityToken, startTime, expiredTime]
      properties:
        tmpSecretId: {type: string, minLength: 1, maxLength: 256}
        tmpSecretKey: {type: string, minLength: 1, maxLength: 256}
        securityToken: {type: string, minLength: 1, maxLength: 4096}
        startTime: {$ref: '#/components/schemas/StorageUnixSeconds'}
        expiredTime: {$ref: '#/components/schemas/StorageUnixSeconds'}
    PrepareStorageUploadRequest:
      type: object
      additionalProperties: false
      required: [key, size, contentType]
      properties:
        key: {$ref: '#/components/schemas/StorageKey'}
        size: {$ref: '#/components/schemas/StorageByteSize'}
        contentType: {$ref: '#/components/schemas/StorageContentType'}
        medium: {$ref: '#/components/schemas/StorageMedium'}
    StorageFileUploadPlan:
      type: object
      additionalProperties: false
      required: [medium, maxBytes]
      properties:
        medium: {type: string, const: file}
        maxBytes: {$ref: '#/components/schemas/StorageByteSize'}
    StorageCosUploadPlan:
      type: object
      additionalProperties: false
      required: [medium, maxBytes, bucket, region, key, credentials, uploadTicket]
      properties:
        medium: {type: string, const: cos}
        maxBytes: {$ref: '#/components/schemas/StorageByteSize'}
        bucket: {type: string, minLength: 1, maxLength: 128}
        region: {type: string, minLength: 1, maxLength: 64}
        key: {$ref: '#/components/schemas/StorageKey'}
        credentials: {$ref: '#/components/schemas/StorageUploadCredential'}
        uploadTicket: {$ref: '#/components/schemas/StorageUploadTicket'}
    PrepareStorageUploadResponse:
      description: 按 medium const 区分的封闭联合；file 分支不签发任何凭据。
      oneOf:
        - $ref: '#/components/schemas/StorageFileUploadPlan'
        - $ref: '#/components/schemas/StorageCosUploadPlan'
    StorageUploadRequest:
      description: 仅用于 multipart。恰好一个二进制 data part，以及限定的 key、medium、contentType 文本字段；重复字段、未知字段、多文件与截断都被拒绝。data 的值是由解析器生成的占位标识，handler 必须核对可信解析上下文，伪造的 JSON 占位不能绕过真实解析。
      type: object
      additionalProperties: false
      required: [key, data]
      properties:
        key: {$ref: '#/components/schemas/StorageKey'}
        medium: {$ref: '#/components/schemas/StorageMedium'}
        contentType: {$ref: '#/components/schemas/StorageContentType'}
        data:
          type: string
          format: binary
    CompleteStorageUploadRequest:
      type: object
      additionalProperties: false
      required: [key, uploadTicket]
      properties:
        key: {$ref: '#/components/schemas/StorageKey'}
        uploadTicket: {$ref: '#/components/schemas/StorageUploadTicket'}
    StorageUploadResult:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: 绝对 HTTP(S) 地址。本地 URL 由配置的公开 API 基址生成，在服务器可达期间有效；COS URL 是签发起一年的签名地址，不提供续签。
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
