VerificationCode:
  type: string
  pattern: '^[0-9]{6}$'
CaptchaSubmission:
  type: object
  additionalProperties: false
  required: [challengeId, answer]
  properties:
    challengeId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
    answer: { type: string, minLength: 1, maxLength: 64 }
CaptchaChallenge:
  type: object
  additionalProperties: false
  required: [challengeId, imageBase64, expiresAt]
  properties:
    challengeId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
    imageBase64:
      type: string
      description: Base64-encoded PNG bytes, without a data URL prefix.
    expiresAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
LoginRequest:
  type: object
  additionalProperties: false
  required: [email, password]
  properties:
    email: { $ref: '../openapi.yaml#/components/schemas/Email' }
    password: { $ref: '../openapi.yaml#/components/schemas/Password' }
    captcha: { $ref: '../openapi.yaml#/components/schemas/CaptchaSubmission' }
LoginResponse:
  type: object
  additionalProperties: false
  required: [token, expiresAt]
  properties:
    token: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
    expiresAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
LogoutResponse:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status: { type: string, const: signed-out }
SsoRequestRef:
  type: object
  additionalProperties: false
  required: [ssoRequestId]
  properties:
    ssoRequestId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
SsoPasswordRequest:
  type: object
  additionalProperties: false
  required: [ssoRequestId, email, password]
  properties:
    ssoRequestId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
    email: { $ref: '../openapi.yaml#/components/schemas/Email' }
    password: { $ref: '../openapi.yaml#/components/schemas/Password' }
    captcha: { $ref: '../openapi.yaml#/components/schemas/CaptchaSubmission' }
SsoRequestInfo:
  type: object
  additionalProperties: false
  required: [ssoRequestId, status, expiresAt, serverTime]
  properties:
    ssoRequestId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
    status: { type: string, enum: [pending, completed] }
    expiresAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
SsoCompleted:
  type: object
  additionalProperties: false
  required: [status, ssoRequestId]
  properties:
    status: { type: string, const: completed }
    ssoRequestId: { $ref: '../openapi.yaml#/components/schemas/OpaqueIdentifier' }
