CurrentUser:
  type: object
  additionalProperties: false
  required: [ id, email, nickname ]
  properties:
    id:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    email: { $ref: '../openapi.yaml#/components/schemas/Email' }
    nickname: { $ref: '../openapi.yaml#/components/schemas/Nickname' }
    qq:
      type: [ string, 'null' ]
      pattern: '^[0-9]{1,20}$'
    fivemId:
      type: [ string, 'null' ]
      pattern: '^fivem:[0-9]+$'
      maxLength: 64
    avatarUrl:
      type: [ string, 'null' ]
      format: uri
UpdateCurrentUserRequest:
  type: object
  additionalProperties: false
  properties:
    nickname: { $ref: '../openapi.yaml#/components/schemas/Nickname' }
    qq:
      type: [ string, 'null' ]
      pattern: '^[0-9]{1,20}$'
    fivemId:
      type: [ string, 'null' ]
      pattern: '^fivem:[0-9]+$'
      maxLength: 64
    avatar:
      type: 'null'
      description: Clear the current avatar reference.
UploadAvatarRequest:
  type: object
  additionalProperties: false
  required: [ imageBase64, mediaType ]
  properties:
    imageBase64:
      type: string
      minLength: 1
      description: Base64-encoded image bytes, without a data URL prefix.
    mediaType:
      type: string
      enum: [ image/png, image/jpeg, image/webp ]
