FeedbackRequestForm:
  type: object
  additionalProperties: false
  required:
    - kind
    - title
    - typeOptionId
    - largeFileInfo
    - contentText
  properties:
    kind:
      type: string
      const: request
    title: &a1
      type: string
      minLength: 1
      maxLength: 400
      pattern: ^[^\u0000-\u001f\u007f-\u009f]+$
    typeOptionId: &a2
      $ref: ../openapi.yaml#/components/schemas/NullableUuid
    largeFileInfo: &a4
      oneOf:
        - type: "null"
        - type: string
          maxLength: 16384
    contentText:
      type: string
      minLength: 1
      maxLength: 65536
    contentFormat: &contentFormat
      type: string
      const: markdown
FeedbackBugDetails:
  type: object
  additionalProperties: false
  required:
    - description
    - reproductionSteps
    - expectedResult
    - actualResult
    - frequency
  properties:
    description:
      type: string
      minLength: 1
      maxLength: 16384
    reproductionSteps:
      oneOf:
        - type: "null"
        - type: string
          minLength: 0
          maxLength: 16384
    expectedResult:
      oneOf:
        - type: "null"
        - type: string
          minLength: 0
          maxLength: 16384
    actualResult:
      oneOf:
        - type: "null"
        - type: string
          minLength: 0
          maxLength: 16384
    frequency:
      oneOf:
        - type: "null"
        - type: string
          enum:
            - always
            - often
            - sometimes
            - once
FeedbackBugForm:
  type: object
  additionalProperties: false
  required:
    - kind
    - title
    - typeOptionId
    - largeFileInfo
    - details
  properties:
    kind:
      type: string
      const: bug
    title: *a1
    typeOptionId: *a2
    largeFileInfo: *a4
    details:
      $ref: ../openapi.yaml#/components/schemas/FeedbackBugDetails
    contentFormat: *contentFormat
FeedbackFeatureForm:
  type: object
  additionalProperties: false
  required: [kind, title, typeOptionId, departmentOptionId, largeFileInfo, contentText]
  properties:
    kind: { type: string, const: feature }
    title: *a1
    typeOptionId: *a2
    departmentOptionId:
      $ref: ../openapi.yaml#/components/schemas/NullableUuid
    largeFileInfo: *a4
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
FeedbackAssetForm:
  type: object
  additionalProperties: false
  required: [kind, title, typeOptionId, action, largeFileInfo, contentText]
  properties:
    kind: { type: string, const: asset }
    title: *a1
    typeOptionId: *a2
    action: &action { type: string, enum: [add, modify, delete, other] }
    largeFileInfo: *a4
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
FeedbackContentForm:
  type: object
  additionalProperties: false
  required: [kind, title, action, largeFileInfo, contentText]
  properties:
    kind: { type: string, const: content }
    title: *a1
    action: *action
    largeFileInfo: *a4
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
FeedbackCampaignForm:
  type: object
  additionalProperties: false
  required: [kind, title, largeFileInfo, contentText]
  properties:
    kind: { type: string, const: campaign }
    title: *a1
    largeFileInfo: *a4
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
FeedbackSuggestionForm:
  type: object
  additionalProperties: false
  required: [kind, title, contentText, largeFileInfo]
  properties:
    kind: { type: string, const: suggestion }
    title: *a1
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
    largeFileInfo: *a4
FeedbackComplaintForm:
  type: object
  additionalProperties: false
  required: [kind, title, contentText, largeFileInfo, anonymous]
  properties:
    kind: { type: string, const: complaint }
    title: *a1
    contentText: { type: string, minLength: 1, maxLength: 65536 }
    contentFormat: *contentFormat
    largeFileInfo: *a4
    anonymous: { type: boolean }
FeedbackForm:
  oneOf:
    - $ref: ../openapi.yaml#/components/schemas/FeedbackRequestForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackBugForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackFeatureForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackAssetForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackContentForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackCampaignForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackSuggestionForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackComplaintForm
FeedbackBugSubmissionForm:
  description: 新建 Bug 反馈必须选择问题分类。
  allOf:
    - $ref: ../openapi.yaml#/components/schemas/FeedbackBugForm
    - type: object
      required: [typeOptionId]
      properties:
        typeOptionId:
          $ref: ../openapi.yaml#/components/schemas/Uuid
FeedbackSubmissionForm:
  oneOf:
    - $ref: ../openapi.yaml#/components/schemas/FeedbackRequestForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackBugSubmissionForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackFeatureForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackAssetForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackContentForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackCampaignForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackSuggestionForm
    - $ref: ../openapi.yaml#/components/schemas/FeedbackComplaintForm
FeedbackAttachmentDeclaration:
  type: object
  additionalProperties: false
  required:
    - id
    - originalName
    - contentType
    - byteLength
    - sha256
  properties:
    id:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    originalName:
      type: string
      minLength: 1
      maxLength: 510
      pattern: ^[^\u0000-\u001f\u007f-\u009f]+$
    contentType:
      type: string
      minLength: 1
      maxLength: 127
      pattern: ^[\x20-\x7e]+$
    byteLength:
      type: integer
      minimum: 1
      maximum: 20971520
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
FeedbackPrepare:
  type: object
  additionalProperties: false
  required:
    - submissionKey
    - form
    - attachments
  properties:
    submissionKey:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    form:
      description: 新建 Bug 反馈必须选择问题分类；其他类型的分类仍可留空。已接收记录的表单快照按 FeedbackForm 读取。
      $ref: ../openapi.yaml#/components/schemas/FeedbackSubmissionForm
    attachments:
      type: array
      maxItems: 5
      items:
        $ref: ../openapi.yaml#/components/schemas/FeedbackAttachmentDeclaration
FeedbackAdvance:
  type: object
  additionalProperties: false
  required:
    - expectedRevision
    - intent
  properties:
    expectedRevision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    intent:
      type: string
      enum:
        - continue
        - retry
FeedbackUpload:
  type: object
  additionalProperties: false
  required:
    - file
  properties:
    file:
      type: string
      format: binary
FeedbackFieldOption:
  type: object
  additionalProperties: false
  required: [id, name, color, orderindex]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 255 }
    color: { type: [string, 'null'], maxLength: 32 }
    orderindex: { type: integer, minimum: 0, maximum: 500 }
FeedbackFieldDefinition:
  type: object
  additionalProperties: false
  required: [id, name, type, required, type_config]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    name: { type: string, minLength: 1, maxLength: 255 }
    type: { type: string, enum: [drop_down, short_text, text] }
    required: { type: boolean }
    type_config:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          maxItems: 500
          items: { $ref: '../openapi.yaml#/components/schemas/FeedbackFieldOption' }
FeedbackKindAvailability:
  type: object
  additionalProperties: false
  required: [kind, available, reason]
  properties:
    kind: { type: string, enum: [bug, feature, asset, request, content, campaign, suggestion, complaint] }
    available: { type: boolean }
    reason: { type: [string, 'null'], enum: [not_configured, configuration_invalid, upstream_unavailable, null] }
FeedbackActionAvailability:
  type: object
  additionalProperties: false
  required: [action, available, reason]
  properties:
    action: { type: string, enum: [add, modify, delete, other] }
    available: { type: boolean }
    reason: { type: [string, 'null'], enum: [tag_missing, null] }
FeedbackLimits:
  type: object
  additionalProperties: false
  required:
    - titleCodePoints
    - userContentBytes
    - fileBytes
    - files
    - totalFileBytes
    - largeFileInfoBytes
  properties:
    titleCodePoints:
      type: integer
      const: 200
    userContentBytes:
      type: integer
      const: 65536
    fileBytes:
      type: integer
      const: 20971520
    files:
      type: integer
      const: 5
    totalFileBytes:
      type: integer
      const: 104857600
    largeFileInfoBytes:
      type: integer
      const: 16384
FeedbackOptions:
  type: object
  additionalProperties: false
  required:
    - available
    - reason
    - fields
    - kinds
    - actions
    - limits
  properties:
    available:
      type: boolean
    reason:
      oneOf:
        - type: "null"
        - type: string
          enum:
            - not_configured
            - configuration_invalid
            - upstream_unavailable
    fields:
      type: array
      maxItems: 3
      items:
        $ref: ../openapi.yaml#/components/schemas/FeedbackFieldDefinition
    kinds:
      type: array
      minItems: 2
      maxItems: 6
      items:
        $ref: ../openapi.yaml#/components/schemas/FeedbackKindAvailability
    actions:
      type: array
      minItems: 0
      maxItems: 4
      items:
        $ref: ../openapi.yaml#/components/schemas/FeedbackActionAvailability
    limits:
      $ref: ../openapi.yaml#/components/schemas/FeedbackLimits
FeedbackFailure:
  type: object
  additionalProperties: false
  required:
    - code
    - phase
    - attachmentId
    - retryAfterSeconds
  properties:
    code:
      type: string
      enum:
        - UPSTREAM_REJECTED
        - UPSTREAM_RATE_LIMITED
        - UPSTREAM_CONFIGURATION
        - UPSTREAM_UNKNOWN
    phase:
      type: string
      enum:
        - create_task
        - upload_attachment
    attachmentId:
      $ref: ../openapi.yaml#/components/schemas/NullableUuid
    retryAfterSeconds:
      oneOf:
        - type: "null"
        - type: integer
          minimum: 1
          maximum: 9007199254740991
FeedbackAttachment:
  type: object
  additionalProperties: false
  required:
    - id
    - ordinal
    - originalName
    - contentType
    - byteLength
    - sha256
    - status
    - remoteAttachmentId
  properties:
    id:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    ordinal:
      type: integer
      minimum: 0
      maximum: 4
    originalName:
      type: string
      minLength: 1
      maxLength: 510
    contentType:
      type: string
      minLength: 1
      maxLength: 127
    byteLength:
      type: integer
      minimum: 1
      maximum: 20971520
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    status:
      type: string
      enum:
        - expected
        - received
        - uploading
        - failed
        - verification_required
        - uploaded
    remoteAttachmentId:
      oneOf:
        - type: "null"
        - type: string
          minLength: 1
          maxLength: 256
FeedbackSnapshot:
  type: object
  additionalProperties: false
  required:
    - id
    - submissionKey
    - revision
    - form
    - createdAt
    - receiveExpiresAt
    - status
    - nextAction
    - taskId
    - taskUrl
    - failure
    - attachments
  properties:
    id:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    submissionKey:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    form:
      $ref: ../openapi.yaml#/components/schemas/FeedbackForm
    createdAt:
      $ref: ../openapi.yaml#/components/schemas/SafeTimestamp
    receiveExpiresAt:
      $ref: ../openapi.yaml#/components/schemas/SafeTimestamp
    status:
      type: string
      enum:
        - receiving
        - ready
        - creating
        - uploading
        - failed
        - verification_required
        - completed
    nextAction:
      type: string
      enum:
        - upload
        - continue
        - wait
        - retry
        - verify
        - done
        - restart
    taskId:
      oneOf:
        - type: "null"
        - type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
    taskUrl:
      oneOf:
        - type: "null"
        - type: string
          minLength: 1
          maxLength: 256
          pattern: ^https://app\.clickup\.com/t/[A-Za-z0-9_-]+$
    failure:
      oneOf:
        - type: "null"
        - $ref: ../openapi.yaml#/components/schemas/FeedbackFailure
    attachments:
      type: array
      maxItems: 5
      items:
        $ref: ../openapi.yaml#/components/schemas/FeedbackAttachment
