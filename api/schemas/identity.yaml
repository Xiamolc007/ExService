OidcChallenge:
  type: string
  minLength: 1
  maxLength: 8192
  pattern: '^\S+$'
OidcInspectRequest:
  type: object
  additionalProperties: false
  required: [phase, challenge]
  properties:
    phase: { type: string, enum: [login, consent] }
    challenge: { $ref: '../openapi.yaml#/components/schemas/OidcChallenge' }
OidcInspectResponse:
  type: object
  additionalProperties: false
  required: [clientName, scopes]
  properties:
    clientName: { type: string }
    scopes:
      type: array
      items: { type: string }
OidcChallengeRequest:
  type: object
  additionalProperties: false
  required: [challenge]
  properties:
    challenge: { $ref: '../openapi.yaml#/components/schemas/OidcChallenge' }
OidcRedirectResponse:
  type: object
  additionalProperties: false
  required: [redirectUrl]
  properties:
    redirectUrl: { type: string, minLength: 1 }
LinkedSessionRef:
  type: object
  additionalProperties: false
  required: [hydraSid, subject]
  properties:
    hydraSid: { type: string, minLength: 1, maxLength: 255 }
    subject: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
LinkedSessionRevokeRequest:
  type: object
  additionalProperties: false
  required: [hydraSid, subject, requestId]
  properties:
    hydraSid: { type: string, minLength: 1, maxLength: 255 }
    subject: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    requestId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
LinkedSessionRevokeResponse:
  type: object
  additionalProperties: false
  required: [revoked]
  properties:
    revoked: { type: boolean, const: true }
SessionCheckResult:
  oneOf:
    - $ref: '../openapi.yaml#/components/schemas/ActiveLinkedSession'
    - $ref: '../openapi.yaml#/components/schemas/InactiveLinkedSession'
ActiveLinkedSession:
  type: object
  additionalProperties: false
  required: [active, sessionId, userId, expiresAt, profile]
  properties:
    active: { type: boolean, const: true }
    sessionId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    userId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    expiresAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    profile:
      type: object
      additionalProperties: false
      required: [nickname, email, avatarUrl, version]
      properties:
        nickname: { $ref: '../openapi.yaml#/components/schemas/Nickname' }
        email: { $ref: '../openapi.yaml#/components/schemas/Email' }
        avatarUrl: { type: [string, 'null'] }
        version: { type: integer, minimum: 0 }
InactiveLinkedSession:
  type: object
  additionalProperties: false
  required: [active, reason]
  properties:
    active: { type: boolean, const: false }
    reason: { type: string, enum: [unknown, revoked, expired, disabled] }
IdentityUserRef:
  type: object
  additionalProperties: false
  required: [userId]
  properties:
    userId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
IdentityUserInfo:
  type: object
  additionalProperties: false
  required: [id, nickname, email, avatarUrl, profileVersion]
  properties:
    id: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    nickname: { $ref: '../openapi.yaml#/components/schemas/Nickname' }
    email: { $ref: '../openapi.yaml#/components/schemas/Email' }
    avatarUrl: { type: [string, 'null'] }
    profileVersion: { type: integer, minimum: 0 }
