NotificationView:
  type: string
  enum: [unread, history]
NotificationScopeFilter:
  type: string
  enum: [all, community, personal]
NotificationCategory:
  type: string
  enum: [announcement, personal_update, service_notice]
NotificationCursor:
  type: string
  minLength: 16
  maxLength: 512
  pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  description: '服务端签名的分页游标，绑定本人、视图、筛选与上界；不透明、不可猜测、不可跨身份或跨视图复用。'
NotificationToken:
  type: string
  minLength: 16
  maxLength: 512
  pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
  description: '服务端签名的短时令牌，绑定本人、用途与到期时间；不可跨身份或跨用途复用。'
NotificationItem:
  type: object
  additionalProperties: false
  required:
    [
      receiptId,
      title,
      summaryText,
      scope,
      category,
      necessity,
      sequence,
      deliveredAt,
      readAt,
      expired,
      stateRevision,
    ]
  properties:
    receiptId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    title: { type: string, minLength: 1, maxLength: 240 }
    summaryText: { type: string, minLength: 0, maxLength: 320 }
    scope: { type: string, enum: [community, personal] }
    category: { $ref: '../openapi.yaml#/components/schemas/NotificationCategory' }
    necessity: { type: string, enum: [optional, necessary] }
    sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
    deliveredAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    readAt:
      type: [integer, 'null']
      minimum: 0
      maximum: 9007199254740991
    expired: { type: boolean }
    stateRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
NotificationList:
  type: object
  additionalProperties: false
  required: [items, nextCursor, unreadCount, upperSequence, readThroughToken, serverTime]
  properties:
    items:
      type: array
      maxItems: 50
      items: { $ref: '../openapi.yaml#/components/schemas/NotificationItem' }
    nextCursor:
      type: [string, 'null']
      minLength: 16
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    unreadCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    upperSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
    readThroughToken: { $ref: '../openapi.yaml#/components/schemas/NotificationToken' }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationSummary:
  type: object
  additionalProperties: false
  required: [unreadCount, stateVersion, upperSequence, readThroughToken, serverTime]
  properties:
    unreadCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    stateVersion: { type: integer, minimum: 0, maximum: 9007199254740991 }
    upperSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
    readThroughToken: { $ref: '../openapi.yaml#/components/schemas/NotificationToken' }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationContent:
  type: object
  additionalProperties: false
  required: [format, schemaVersion, policyVersion, html, text]
  properties:
    format: { type: string, const: html }
    schemaVersion: { type: integer, const: 1 }
    policyVersion: { type: string, const: notification-html-v1 }
    html:
      type: string
      minLength: 1
      description: '已按当前策略规范化并重新校验的安全 HTML；正文不含脚本、事件属性、样式、内嵌资源或可执行组件。'
    text:
      type: string
      minLength: 1
      description: '由安全树派生的完整纯文本，供格式不可用时回退展示。'
NotificationAction:
  type: object
  additionalProperties: false
  required: [actionId, kind, label, emphasis, enabled, unavailableReason, navigationTarget]
  properties:
    actionId: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9._-]+$' }
    kind: { type: string, enum: [navigate, command] }
    label: { type: string, minLength: 1, maxLength: 64 }
    emphasis: { type: string, enum: [primary, secondary] }
    enabled: { type: boolean }
    unavailableReason:
      oneOf:
        - type: 'null'
        - type: string
          enum: [unsupported, expired, forbidden, state_changed]
    navigationTarget:
      type: [object, 'null']
      additionalProperties: false
      required: [kind, path]
      properties:
        kind: { type: string, const: internal }
        path: { type: string, minLength: 1, maxLength: 240, pattern: '^/' }
NotificationDetail:
  type: object
  additionalProperties: false
  required:
    [
      receiptId,
      title,
      scope,
      category,
      necessity,
      sequence,
      deliveredAt,
      readAt,
      clearedAt,
      lifecycle,
      stateRevision,
      clearRevision,
      contentAvailable,
      content,
      contentFallbackText,
      actions,
      actionsAvailable,
      serverTime,
    ]
  properties:
    receiptId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    title: { type: string, minLength: 1, maxLength: 240 }
    scope: { type: string, enum: [community, personal] }
    category: { $ref: '../openapi.yaml#/components/schemas/NotificationCategory' }
    necessity: { type: string, enum: [optional, necessary] }
    sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
    deliveredAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    readAt:
      type: [integer, 'null']
      minimum: 0
      maximum: 9007199254740991
    clearedAt:
      type: [integer, 'null']
      minimum: 0
      maximum: 9007199254740991
    lifecycle: { type: string, enum: [active, expired] }
    stateRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    clearRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    contentAvailable: { type: boolean }
    content:
      description: '当前策略下可安全渲染的正文；不可用时为 null，调用方必须改用 contentFallbackText，不得展示原始 HTML。'
      oneOf:
        - $ref: '../openapi.yaml#/components/schemas/NotificationContent'
        - type: 'null'
    contentFallbackText:
      type: [string, 'null']
      minLength: 1
    actions:
      type: array
      maxItems: 4
      items: { $ref: '../openapi.yaml#/components/schemas/NotificationAction' }
    actionsAvailable: { type: boolean }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationState:
  type: object
  additionalProperties: false
  required: [receiptId, read, stateRevision, unreadCount, serverTime]
  properties:
    receiptId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    read: { type: boolean }
    stateRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    unreadCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationStateUpdateRequest:
  type: object
  additionalProperties: false
  required: [read, expectedRevision]
  properties:
    read: { type: boolean }
    expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
NotificationReadAllRequest:
  type: object
  additionalProperties: false
  required: [requestId, readThroughToken]
  properties:
    requestId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    readThroughToken: { $ref: '../openapi.yaml#/components/schemas/NotificationToken' }
NotificationReadAllResult:
  type: object
  additionalProperties: false
  required: [requestId, affectedCount, watermarkSequence, unreadCount, replayed, serverTime]
  properties:
    requestId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    affectedCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    watermarkSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
    unreadCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    replayed: { type: boolean }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationClearPreviewRequest:
  type: object
  additionalProperties: false
  description: '封闭且为空；清理范围永远由服务端按当时全局未清理历史决定，不接受客户端筛选、行数或时间推断。'
NotificationClearPreview:
  type: object
  additionalProperties: false
  required: [batchId, itemCount, upperSequence, clearSnapshotToken, expiresAt, serverTime]
  properties:
    batchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    itemCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    upperSequence: { type: integer, minimum: 0, maximum: 9007199254740991 }
    clearSnapshotToken: { $ref: '../openapi.yaml#/components/schemas/NotificationToken' }
    expiresAt: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationClearAllRequest:
  type: object
  additionalProperties: false
  required: [requestId, clearSnapshotToken]
  properties:
    requestId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    clearSnapshotToken: { $ref: '../openapi.yaml#/components/schemas/NotificationToken' }
NotificationClearResult:
  type: object
  additionalProperties: false
  required: [requestId, batchId, affectedCount, skippedCount, unreadCount, replayed, serverTime]
  properties:
    requestId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    batchId: { $ref: '../openapi.yaml#/components/schemas/Uuid' }
    affectedCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    skippedCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    unreadCount: { type: integer, minimum: 0, maximum: 9007199254740991 }
    replayed: { type: boolean }
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationPreferences:
  type: object
  additionalProperties: false
  required: [revision, optionalCategories, necessaryCategories, serverTime]
  properties:
    revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    optionalCategories:
      type: object
      additionalProperties: false
      required: [announcement, personal_update]
      properties:
        announcement: { type: boolean }
        personal_update: { type: boolean }
    necessaryCategories:
      type: array
      maxItems: 8
      items: { $ref: '../openapi.yaml#/components/schemas/NotificationCategory' }
      description: '由 catalog 固定的必要类别，展示说明用，不可写入也不可关闭。'
    serverTime: { $ref: '../openapi.yaml#/components/schemas/SafeTimestamp' }
NotificationPreferencesUpdateRequest:
  type: object
  additionalProperties: false
  required: [expectedRevision, optionalCategories]
  properties:
    expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
    optionalCategories:
      type: object
      additionalProperties: false
      required: [announcement, personal_update]
      properties:
        announcement: { type: boolean }
        personal_update: { type: boolean }
