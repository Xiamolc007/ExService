name: exwebsite-local-dev
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    labels:
      dev.exwebsite.config: ${LOCAL_CONFIG_FINGERPRINT:?configure first}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure first}
      OUTLINE_PASSWORD: ${OUTLINE_PASSWORD:?configure first}
      HYDRA_PASSWORD: ${HYDRA_PASSWORD:?configure first}
    ports: ['127.0.0.1:${LOCAL_POSTGRES_PORT:?configure first}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docs-integration/postgres/init-local.sh:/docker-entrypoint-initdb.d/10-local-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    labels:
      dev.exwebsite.config: ${LOCAL_CONFIG_FINGERPRINT:?configure first}
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:${LOCAL_REDIS_PORT:?configure first}:6379']
    volumes: ['redisdata:/data']
  hydra:
    image: oryd/hydra:v2.3.0@sha256:b94007e19a1f7f78157e7f4ea340da8a55b5f104a0f1198755c256f38ef32b4b
    labels:
      dev.exwebsite.config: ${LOCAL_CONFIG_FINGERPRINT:?configure first}
    command: [serve, all, --dev]
    ports:
      - '127.0.0.1:${LOCAL_HYDRA_PUBLIC_PORT:?configure first}:4444'
      - '127.0.0.1:${LOCAL_HYDRA_ADMIN_PORT:?configure first}:4445'
    environment:
      DSN: postgres://hydra:${HYDRA_PASSWORD:?configure first}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?configure first}
      URLS_SELF_ISSUER: ${LOCAL_ISSUER:?configure first}
      URLS_LOGIN: ${LOCAL_PUBLIC_ORIGIN:?configure first}/identity/login
      URLS_CONSENT: ${LOCAL_PUBLIC_ORIGIN:?configure first}/identity/consent
      URLS_LOGOUT: ${LOCAL_PUBLIC_ORIGIN:?configure first}/identity/logout
      SERVE_PUBLIC_HOST: 0.0.0.0
      SERVE_ADMIN_HOST: 0.0.0.0
      TTL_AUTH_CODE: 60s
      TTL_ACCESS_TOKEN: 60s
      TTL_ID_TOKEN: 60s
      LOG_LEVEL: warn
      LOG_FORMAT: json
      LOG_LEAK_SENSITIVE_VALUES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
    labels:
      dev.exwebsite.config: ${LOCAL_CONFIG_FINGERPRINT:?configure first}
  redisdata:
    labels:
      dev.exwebsite.config: ${LOCAL_CONFIG_FINGERPRINT:?configure first}
