<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统一文档界面 · 交互预览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='m10 6 10 10-10 10' fill='none' stroke='%23171717' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --bg:#fff; --sidebar:#f7f7f7; --fg:#171717; --muted:#737373; --line:#e5e5e5; --hover:#ededed; --selected:#e4e4e4; --width:280px }
    :root.dark { color-scheme:dark; --bg:#171717; --sidebar:#202020; --fg:#fafafa; --muted:#a3a3a3; --line:#363636; --hover:#303030; --selected:#3c3c3c }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif }
    button,input,select { font:inherit; color:inherit }
    button,a,select { -webkit-tap-highlight-color:transparent }
    button { cursor:pointer }
    button:disabled { opacity:.5; cursor:default }
    a { color:inherit; text-decoration:none }
    :focus-visible { outline:2px solid var(--muted); outline-offset:3px }
    [hidden] { display:none!important }
    svg { width:20px; height:20px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
    .preview { position:relative; z-index:20; min-height:52px; display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--bg); font-size:12px }
    .preview strong { font-size:13px }
    .preview label { display:flex; align-items:center; gap:7px }
    select { border:1px solid var(--line); background:var(--sidebar); border-radius:6px; padding:3px 8px; max-width:200px }
    .preview .note { color:var(--muted); margin-left:auto }
    .sidebar { width:var(--width); position:fixed; top:var(--top,52px); bottom:0; left:0; background:var(--sidebar); display:flex; flex-direction:column; z-index:10; border-right:1px solid var(--line) }
    .brand { display:flex; align-items:center; gap:8px; padding:18px 16px 22px; min-width:0 }
    .mark { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:var(--bg); border:1px solid var(--line); box-shadow:0 2px 5px #0000000a }
    .mark svg { width:27px; height:27px; fill:currentColor; stroke:none }
    .brand strong { font-size:20px; letter-spacing:-.5px; white-space:nowrap }
    .icon-button { display:grid; place-items:center; padding:5px; background:none; border:0; border-radius:5px }
    .icon-button:hover { background:var(--hover) }
    .brand .icon-button { margin-left:auto }
    .nav { padding:0 10px }
    .row { display:flex; align-items:center; min-height:34px; gap:9px; border-radius:6px; padding:5px 10px; font-size:14px }
    .row:hover { background:var(--hover) }
    .row[aria-current="page"] { background:var(--selected); font-weight:600 }
    .row .label { overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
    .row .shortcut { color:var(--muted); font-size:11px; margin-left:auto }
    .section-label { display:block; padding:18px 10px 6px; color:var(--muted); font-size:12px; font-weight:500 }
    .tree { flex:1; overflow:auto; padding:0 10px 20px }
    .tree-row { display:flex; align-items:center; border-radius:6px }
    .tree-row:hover { background:var(--hover) }
    .tree-row .row { flex:1; min-width:0; padding-left:3px }
    .disclosure { width:23px; height:30px; padding:0; border:0; background:none; color:var(--muted); display:grid; place-items:center; flex-shrink:0 }
    .disclosure svg { width:14px; height:14px }
    .tree-child { padding-left:24px }
    .tree-child .row { padding-left:23px }
    .account { border-top:1px solid var(--line); padding:12px 14px }
    .account button { width:100%; display:flex; align-items:center; gap:10px; border:0; background:none; padding:7px 8px; border-radius:6px; text-align:left; font-size:14px }
    .account button:hover { background:var(--hover) }
    .account small { display:block; color:var(--muted); font-size:11px }
    .avatar { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:var(--fg); color:var(--bg); font-size:12px }
    .resize { position:absolute; right:-3px; top:0; bottom:0; width:6px; cursor:ew-resize; touch-action:none }
    .resize:focus-visible,.resize:hover { background:var(--line) }
    .workspace { margin-left:var(--width); min-height:calc(100vh - var(--top,52px)) }
    .toolbar { display:flex; align-items:center; height:60px; gap:12px; padding:12px 28px; color:var(--muted); font-size:13px }
    .toolbar .crumb { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .button { border:1px solid var(--line); border-radius:6px; padding:5px 12px; background:var(--bg); font-size:13px }
    .button:hover { background:var(--hover) }
    .primary { background:var(--fg); color:var(--bg); border-color:var(--fg) }
    .primary:hover { opacity:.85; background:var(--fg) }
    .content { max-width:848px; margin:0 auto; padding:38px 44px 96px }
    h1 { font-size:34px; line-height:1.3; margin:0 0 18px; letter-spacing:-1px; font-weight:700; overflow-wrap:anywhere }
    h2 { font-size:23px; margin:36px 0 12px; line-height:1.4; letter-spacing:-.4px }
    h3 { font-size:17px; margin:22px 0 8px }
    p { margin:12px 0 }
    .lead,.muted { color:var(--muted) }
    .collection-list { margin-top:34px; border-top:1px solid var(--line) }
    .collection-card { display:flex; align-items:flex-start; gap:15px; padding:22px 4px; border-bottom:1px solid var(--line) }
    .collection-card:hover { background:var(--sidebar) }
    .collection-card svg { margin-top:4px }
    .collection-card strong { display:block; font-size:17px; margin-bottom:3px }
    .collection-card p { margin:0; color:var(--muted); font-size:14px }
    .collection-card .arrow { margin-left:auto; color:var(--muted) }
    .document { font-size:16px; line-height:1.8 }
    .document a { text-decoration:underline; text-underline-offset:3px }
    .document blockquote { margin:24px 0; border-left:3px solid var(--line); padding:4px 20px; color:var(--muted) }
    .document pre { background:var(--sidebar); padding:18px; border:1px solid var(--line); border-radius:7px; overflow:auto; font:13px/1.8 Consolas,monospace }
    .document ul { padding-left:24px }
    .toc { border-left:1px solid var(--line); margin-top:26px; padding:0 0 0 18px; display:flex; flex-wrap:wrap; gap:7px 20px; font-size:13px; color:var(--muted) }
    .attachment { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:7px; padding:12px 16px; font-size:14px; background:var(--sidebar) }
    .attachment small { margin-left:auto; color:var(--muted) }
    .state { margin:40px 0; border:1px solid var(--line); padding:26px; border-radius:8px }
    .state h2 { margin:0 0 8px; font-size:19px }
    .state .button { margin-top:12px }
    .feedback { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:280px; gap:12px }
    .feedback h2,.feedback p { margin:0 }
    .feedback p { max-width:420px }
    .feedback-icon { display:grid; place-items:center; width:52px; height:52px; color:var(--muted) }
    .feedback-icon svg { width:36px; height:36px }
    .feedback[data-state="error"] .feedback-icon { color:#b91c1c }
    .dark .feedback[data-state="error"] .feedback-icon { color:#f87171 }
    .feedback[data-state="loading"] .feedback-icon svg { animation:loading-spin 1s linear infinite }
    @keyframes loading-spin { to { transform:rotate(360deg) } }
    @media(prefers-reduced-motion:reduce) { .feedback[data-state="loading"] .feedback-icon svg { animation:none } }
    .banner { font-size:13px; border:1px solid var(--line); background:var(--sidebar); padding:10px 14px; border-radius:6px; margin-bottom:24px }
    .search-form { display:flex; gap:8px; margin:28px 0 }
    .search-form input { flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:9px 12px; background:var(--bg) }
    .result { display:block; padding:18px 0; border-bottom:1px solid var(--line) }
    .result strong { font-size:17px }
    .result p { color:var(--muted); font-size:14px; margin:5px 0 }
    .comment { border-top:1px solid var(--line); margin-top:48px; padding-top:18px }
    .comment input { width:100%; padding:12px; background:var(--bg); border:1px solid var(--line); border-radius:6px; margin:12px 0 }
    .mobile-toggle { display:none }
    .backdrop { position:fixed; inset:var(--top,52px) 0 0; background:#0005; border:0; z-index:9 }
    .collapsed .sidebar { transform:translateX(-100%) }
    .collapsed .workspace { margin-left:0 }
    .collapsed .mobile-toggle { display:grid }
    @media(max-width:760px) {
      .preview { gap:7px 12px; padding:8px 12px }
      .preview .note { margin-left:0; width:100% }
      .sidebar { width:min(300px,85vw); transform:translateX(-100%); box-shadow:6px 0 30px #0001 }
      .mobile-open .sidebar { transform:none }
      .workspace { margin-left:0 }
      .mobile-toggle { display:grid }
      .toolbar { padding:10px 16px; height:54px }
      .content { padding:24px 24px 70px }
      h1 { font-size:29px }
      .resize { display:none }
    }
    @media(prefers-reduced-motion:no-preference) { .sidebar { transition:transform 150ms ease } }
  </style>
</head>
<body>
  <div class="preview" aria-label="预览控制">
    <strong>交互预览</strong>
    <label>身份 <select id="identity"><option value="guest">访客</option><option value="reader">登录读者</option><option value="editor">集合编辑者</option></select></label>
    <label>场景 <select id="scenario"><option value="normal">正常内容</option><option value="empty">无公开集合</option><option value="emptyCollection">空集合</option><option value="loading">加载中</option><option value="error">接口失败</option><option value="identityUnavailable">身份服务不可用</option><option value="logoutError">退出失败</option><option value="revoked">公开状态撤销</option></select></label>
    <button class="button" id="theme">切换深色</button>
    <span class="note">示例数据 · 不连接账号或文档服务</span>
  </div>
  <aside class="sidebar" aria-label="文档侧栏" id="sidebar">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 1024 1024"><path d="M567.469 508.934L270.636 215.422C269.365 214.166 270.255 212 272.042 212H524.028C524.556 212 525.062 212.209 525.437 212.581L754.409 439.893C754.787 440.269 755 440.78 755 441.313V584.965C755 585.5 754.786 586.012 754.405 586.388L526.537 811.423C526.163 811.793 525.658 812 525.132 812L272.004 812C270.222 812 269.33 809.845 270.59 808.585L567.477 511.771C568.261 510.987 568.258 509.714 567.469 508.934Z"/><path d="M275.072 600.794V424C275.072 422.895 275.967 422 277.072 422H344.598C345.093 422 345.57 422.184 345.938 422.515L443.501 510.571C444.378 511.364 444.381 512.74 443.506 513.536L345.939 602.273C345.571 602.608 345.091 602.794 344.594 602.794H277.072C275.967 602.794 275.072 601.898 275.072 600.794Z"/></svg></span><strong>Exre Service</strong><button class="icon-button" id="collapse" aria-label="折叠侧栏"></button></div>
    <nav class="nav" aria-label="文档导航" id="nav"></nav>
    <nav class="tree" aria-label="集合与文档树" id="tree"></nav>
    <div class="account" id="account"></div>
    <div class="resize" id="resize" role="separator" tabindex="0" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="400" aria-valuenow="280"></div>
  </aside>
  <button class="backdrop" id="backdrop" aria-label="关闭侧栏" hidden></button>
  <div class="workspace">
    <header class="toolbar"><button class="icon-button mobile-toggle" id="open" aria-label="展开侧栏"></button><span class="crumb" id="crumb">文档</span><div id="actions"></div></header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
  <script>
    'use strict';
    const icons = {
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
      book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h14v19H6a2.5 2.5 0 0 1 0-5h14"/>',
      doc:'<path d="M14 2H5v20h14V7Z M14 2v5h5 M8 12h8 M8 16h6"/>',
      panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
      chevron:'<path d="m9 5 7 7-7 7"/>',
      down:'<path d="m5 9 7 7 7-7"/>',
      login:'<path d="M15 3h5v18h-5 M3 12h12 m-5-5 5 5-5 5"/>',
      arrow:'<path d="M4 12h16 m-6-6 6 6-6 6"/>',
      clip:'<path d="m8 15 8-8a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l9-9"/>',
      loading:'<path d="M12 3a9 9 0 1 1-9 9"/>',
      error:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6 M12 17h.01"/>'
    };
    const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.doc}</svg>`;
    const escapeText = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const collections = [
      {id:'guide',name:'使用指南',description:'从第一次访问开始，了解服务、账号与文档。',public:true},
      {id:'community',name:'社区与协作',description:'社区约定、参与方式与常见问题。',public:true},
      {id:'internal',name:'成员手册',description:'仅对已获集合阅读授权的成员开放。',public:false}
    ];
    const documents = [
      {id:'start',collection:'guide',title:'开始使用',parent:null,public:true},
      {id:'account',collection:'guide',title:'账号与身份',parent:'start',public:true},
      {id:'reading',collection:'guide',title:'阅读与搜索',parent:'start',public:true},
      {id:'faq',collection:'guide',title:'常见问题',parent:null,public:true},
      {id:'contribute',collection:'community',title:'参与社区',parent:null,public:true},
      {id:'rules',collection:'community',title:'协作约定',parent:'contribute',public:true},
      {id:'internalGuide',collection:'internal',title:'成员协作流程',parent:null,public:false}
    ];
    const state = {identity:'guest',scenario:'normal',expanded:new Set(['guide','start']),notice:'',editing:false,query:'',retryGeneration:0};
    const element = id => document.getElementById(id);
    const locationState = () => { const parts=location.hash.slice(1).split('?'); const params=new URLSearchParams(parts[1]); return {page:parts[0] || 'overview',query:params.get('q') || ''}; };
    function visibleCollections() { return state.scenario==='empty' ? [] : collections.filter(collection => collection.public || state.identity!=='guest'); }
    function visibleDocuments() { return state.scenario==='empty' || state.scenario==='emptyCollection' ? [] : documents.filter(document => (document.public || state.identity!=='guest') && !(state.scenario==='revoked' && document.id==='start')); }
    function link(page,label,name,active=false) { return `<a class="row" href="#${page}"${active?' aria-current="page"':''}>${icon(name)}<span class="label">${escapeText(label)}</span></a>`; }
    function navigate(page) { if(location.hash===`#${page}`) { render(true); } else { location.hash=page; } }
    function renderTree() {
      const current=locationState().page;
      let result='<span class="section-label">'+(state.identity==='guest'?'公开文档集':'文档集')+'</span>';
      for(const collection of visibleCollections()) {
        const expanded=state.expanded.has(collection.id);
        result+=`<div class="tree-row"><button class="disclosure" data-expand="${collection.id}" aria-label="${expanded?'折叠':'展开'}${collection.name}" aria-expanded="${expanded}">${icon(expanded?'down':'chevron')}</button>${link('collection/'+collection.id,collection.name,'book',current==='collection/'+collection.id)}</div>`;
        if(expanded) {
          const rows=visibleDocuments().filter(document => document.collection===collection.id);
          if(state.scenario==='error' || state.scenario==='loading') { result+=`<p class="muted" style="padding-left:24px;font-size:12px">${state.scenario==='error'?'加载失败，可在正文重试':'正在加载文档树…'}</p>`; continue; }
          const renderDocument=(entry,depth) => {
            const children=rows.filter(child => child.parent===entry.id);
            const open=state.expanded.has(entry.id);
            result+=`<div style="padding-left:${depth*19}px" class="tree-row">${children.length?`<button class="disclosure" data-expand="${entry.id}" aria-label="${open?'折叠':'展开'}${entry.title}" aria-expanded="${open}">${icon(open?'down':'chevron')}</button>`:'<span style="width:23px;flex-shrink:0"></span>'}${link('doc/'+entry.id,entry.title,'doc',current==='doc/'+entry.id)}</div>`;
            if(open) { children.forEach(child => renderDocument(child,depth+1)); }
          };
          rows.filter(document => !document.parent || !rows.some(parent => parent.id===document.parent)).forEach(entry => renderDocument(entry,1));
          if(!rows.length) { result+='<p class="muted" style="padding-left:24px;font-size:12px">暂无公开文档</p>'; }
        }
      }
      return result;
    }
    function feedback(title,description,retry=false,kind=retry?'error':'empty') { return `<div class="state feedback" data-state="${kind}" role="${retry?'alert':'status'}"${kind==='loading'?' aria-busy="true"':''}><span class="feedback-icon" aria-hidden="true">${icon(kind==='empty'?'doc':kind)}</span><h2>${escapeText(title)}</h2><p class="muted">${escapeText(description)}</p>${retry?'<button class="button primary" data-action="retry-content">重试</button>':''}</div>`; }
    function render(focus=false) {
      let {page,query}=locationState();
      const requested=documents.find(document => page==='doc/'+document.id);
      if(requested && !visibleDocuments().includes(requested)) { state.notice='该文档暂不可阅读，已返回公开总览。'; history.replaceState(null,'','#overview'); page='overview'; }
      const doc=documents.find(document => page==='doc/'+document.id);
      const collection=collections.find(collection => page==='collection/'+collection.id);
      if(collection && !visibleCollections().includes(collection)) { history.replaceState(null,'','#overview'); render(focus); return; }
      if(doc && state.navigationTarget!==page) {
        state.expanded.add(doc.collection);
        const visible=visibleDocuments();
        const visited=new Set([doc.id]);
        let ancestor=doc;
        while(ancestor.parent) {
          const parent=visible.find(entry => entry.id===ancestor.parent);
          if(!parent || visited.has(parent.id)) { break; }
          visited.add(parent.id);
          state.expanded.add(parent.id);
          ancestor=parent;
        }
      }
      state.navigationTarget=page;
      element('nav').innerHTML=link('overview',state.identity==='guest'?'文档总览':'首页','home',page==='overview')+link('search','搜索','search',page==='search');
      element('tree').innerHTML=renderTree();
      element('account').innerHTML=state.identity==='guest'?`<button data-action="login">${icon('login')}<span>登录</span></button>`:`<button data-action="logout"><span class="avatar">${state.identity==='editor'?'编':'读'}</span><span>${state.identity==='editor'?'集合编辑者':'登录读者'}<small>退出后继续公开阅读</small></span></button>`;
      element('identity').value=state.identity;
      element('scenario').value=state.scenario;
      const canEdit=state.identity==='editor' && doc?.collection==='guide';
      element('actions').innerHTML=doc?`<button class="button" data-action="toc" aria-expanded="${state.showToc!==false}">目录</button>${canEdit?'<button class="button" data-action="edit" style="margin-left:8px">'+(state.editing?'完成编辑':'编辑')+'</button>':''}`:'';
      element('crumb').textContent=doc?collections.find(collection => collection.id===doc.collection).name+' / '+doc.title:collection?collection.name:page==='search'?'搜索':'文档';
      let html=state.notice?`<div class="banner" role="status">${escapeText(state.notice)}</div>`:'';
      if(state.scenario==='identityUnavailable') { html+='<div class="banner" role="status">登录状态暂时不可用，公开文档仍可阅读。 <button class="button" data-action="retry">重试</button></div>'; }
      if(state.scenario==='loading') { html+=feedback('正在加载','正在获取公开内容，请稍候。',false,'loading'); }
      else if(state.scenario==='error') { html+=feedback('加载失败','请求超时，暂时无法连接文档服务。请检查网络连接后重试。',true); }
      else if(doc) {
        html+=`<article class="document"><h1>${doc.title}</h1><nav class="toc" aria-label="文章目录"${state.showToc===false?' hidden':''}><a href="#" data-heading="welcome">了解文档服务</a><a href="#" data-heading="steps">开始阅读</a><a href="#" data-heading="access">登录与权限</a></nav><div ${state.editing&&canEdit?'contenteditable="true" aria-label="编辑正文"':''}><h2 id="welcome">了解文档服务</h2><p>欢迎来到 Exre Service 文档库。这里汇集了使用指南与社区协作材料，你可以从侧栏选择文档集，也可以直接搜索所需内容。</p><blockquote>公开内容无需登录即可阅读。登录后，根据你获得的实际授权，显示更多内容和操作。</blockquote><h2 id="steps">开始阅读</h2><ul><li>展开侧栏中的文档集，浏览完整的文档层级。</li><li>使用搜索定位问题，或通过目录跳转到对应章节。</li><li>在手机上，通过左上角按钮打开文档侧栏。</li></ul><pre>文档总览 → 选择文档集 → 阅读文档\n登录与退出 → 保持安全的阅读位置</pre><h2 id="access">登录与权限</h2><p>登录入口和账号菜单位于同一个侧栏区域。仅获公开阅读权的用户继续使用公共正文，编辑操作只向有权编辑当前集合的用户显示。</p><div class="attachment">${icon('clip')}<span>快速入门参考.pdf</span><small>示例附件</small></div></div>${state.identity!=='guest'?'<section class="comment"><h3>评论</h3><p class="muted">示例：登录读者可在获授权的文档中参与讨论。</p><label for="comment">添加评论</label><input id="comment" placeholder="分享你的想法"><button class="button" data-action="comment">发表</button><p id="comment-status" role="status"></p></section>':''}</article>`;
      } else if(page==='search') {
        html+=`<h1>搜索</h1><p class="lead">${state.identity==='guest'?'搜索公开文档。':'搜索当前获授权的文档。'}</p><form class="search-form" id="search-form" role="search"><input id="query" aria-label="搜索文档" maxlength="200" value="${escapeText(query)}" placeholder="搜索文档…"><button class="button primary" type="submit">搜索</button></form>`;
        const results=visibleDocuments().filter(document => document.title.includes(query));
        html+=!query?'<p class="muted">请输入搜索词。</p>':results.length?results.map(document => `<a href="#doc/${document.id}" class="result"><strong>${document.title}</strong><p>${collections.find(collection => collection.id===document.collection).name} · 了解服务与协作。</p></a>`).join(''):feedback('没有搜索结果','请尝试其他关键词。');
      } else {
        const list=collection?visibleDocuments().filter(document => document.collection===collection.id):visibleCollections();
        html+=`<h1>${collection?collection.name:state.identity==='guest'?'公开文档集':'文档工作区'}</h1><p class="lead">${collection?collection.description:state.identity==='guest'?'浏览公开的使用指南与社区文档。':'继续阅读公开内容，或访问你已获授权的文档集。'}</p>`;
        html+=list.length?'<div class="collection-list">'+list.map(entry => `<a class="collection-card" href="#${collection?'doc/':'collection/'}${entry.id}">${icon(collection?'doc':'book')}<div><strong>${escapeText(entry.title||entry.name)}</strong><p>${escapeText(entry.description||'阅读文档')}</p></div><span class="arrow">${icon('arrow')}</span></a>`).join('')+'</div>':feedback(collection?'此集合暂无公开文档':'暂无公开文档集',collection?'公开文档发布后将出现在这里。':'你仍可使用搜索和登录入口。');
      }
      element('content').innerHTML=html;
      if(focus) { element('content').focus({preventScroll:true}); window.scrollTo(0,0); }
      syncSidebar();
    }
    function closeSidebar() { document.body.classList.remove('mobile-open'); syncSidebar(); }
    function syncSidebar() {
      const mobile=matchMedia('(max-width:760px)').matches;
      const closed=mobile?!document.body.classList.contains('mobile-open'):document.body.classList.contains('collapsed');
      const restoreFocus=element('sidebar').contains(document.activeElement) || document.activeElement===element('backdrop');
      document.querySelector('.workspace').inert=mobile && !closed;
      element('sidebar').inert=closed;
      element('sidebar').setAttribute('aria-hidden',String(closed));
      element('open').setAttribute('aria-expanded',String(!closed));
      element('backdrop').hidden=!mobile || closed;
      if(closed && restoreFocus) { element('open').focus(); }
    }
    document.addEventListener('click',event => {
      const toggle=event.target.closest('[data-expand]');
      if(toggle) { const id=toggle.dataset.expand; state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); render(); element('tree').querySelector(`[data-expand="${id}"]`)?.focus(); return; }
      const heading=event.target.closest('[data-heading]');
      if(heading) { event.preventDefault(); element(heading.dataset.heading)?.scrollIntoView({block:'start'}); return; }
      const action=event.target.closest('[data-action]')?.dataset.action;
      if(action==='login') { if(state.scenario==='identityUnavailable') { state.notice='暂时无法登录，请稍后重试；公开阅读保持可用。'; } else { state.identity='reader'; state.notice='已登录，保持当前阅读位置。'; } closeSidebar(); render(true); }
      if(action==='logout') { if(state.scenario==='logoutError') { state.notice='退出失败，请重试。当前身份尚未撤销。'; } else { state.identity='guest'; state.editing=false; state.notice='已退出，继续公开阅读。'; } closeSidebar(); render(true); }
      if(action==='retry') { state.scenario='normal'; state.notice=''; render(true); }
      if(action==='retry-content') {
        const generation=++state.retryGeneration;
        state.scenario='loading'; state.notice=''; render(true);
        setTimeout(() => {
          if(generation!==state.retryGeneration || state.scenario!=='loading') { return; }
          state.scenario='normal'; render(true);
        },700);
      }
      if(action==='toc') { state.showToc=state.showToc===false; render(); element('actions').querySelector('[data-action="toc"]').focus(); }
      if(action==='edit') { state.editing=!state.editing; render(); element('actions').querySelector('[data-action="edit"]').focus(); }
      if(action==='comment') { const value=element('comment').value.trim(); element('comment-status').textContent=value?'示例评论已发表。':'请先输入评论。'; }
      if(event.target.closest('a[href^="#"]') && !heading) { state.editing=false; state.notice=''; closeSidebar(); }
    });
    document.addEventListener('submit',event => { if(event.target.id==='search-form') { event.preventDefault(); navigate('search?q='+encodeURIComponent(element('query').value.trim())); } });
    element('identity').addEventListener('change',event => { state.retryGeneration+=1; state.identity=event.target.value; state.editing=false; state.notice=''; closeSidebar(); render(true); });
    element('scenario').addEventListener('change',event => { state.retryGeneration+=1; state.scenario=event.target.value; state.notice=''; closeSidebar(); render(true); });
    element('theme').addEventListener('click',() => { const dark=document.documentElement.classList.toggle('dark'); element('theme').textContent=dark?'切换浅色':'切换深色'; });
    element('collapse').innerHTML=icon('panel'); element('open').innerHTML=icon('panel');
    element('collapse').addEventListener('click',() => { if(matchMedia('(max-width:760px)').matches) { closeSidebar(); } else { document.body.classList.add('collapsed'); syncSidebar(); element('open').focus(); } });
    element('open').addEventListener('click',() => { document.body.classList.remove('collapsed'); document.body.classList.add('mobile-open'); syncSidebar(); element('collapse').focus(); });
    element('backdrop').addEventListener('click',closeSidebar);
    document.addEventListener('keydown',event => { if(event.key==='Escape' && document.body.classList.contains('mobile-open')) { closeSidebar(); element('open').focus(); } });
    const setWidth=width => { const value=Math.min(400,Math.max(220,width)); document.documentElement.style.setProperty('--width',value+'px'); element('resize').setAttribute('aria-valuenow',String(value)); };
    element('resize').addEventListener('keydown',event => { if(event.key==='ArrowLeft'||event.key==='ArrowRight') { event.preventDefault(); setWidth(Number(element('resize').getAttribute('aria-valuenow'))+(event.key==='ArrowRight'?10:-10)); } });
    element('resize').addEventListener('pointerdown',event => { event.preventDefault(); element('resize').setPointerCapture(event.pointerId); });
    element('resize').addEventListener('pointermove',event => { if(element('resize').hasPointerCapture(event.pointerId)) { setWidth(event.clientX); } });
    element('resize').addEventListener('dblclick',() => setWidth(280));
    addEventListener('hashchange',() => render(true));
    addEventListener('resize',syncSidebar);
    new ResizeObserver(entries => { document.documentElement.style.setProperty('--top',entries[0].target.getBoundingClientRect().height+'px'); }).observe(document.querySelector('.preview'));
    render();
  </script>
</body>
</html>
