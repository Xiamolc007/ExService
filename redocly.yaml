extends:
  - recommended

rules:
  # 首版 Contract 未包含认证，因此当时关闭了此规则。当前 Contract 已定义 bearerAuth，
  # 并逐 operation 声明公开访问或所需认证；此处保留既有 lint 配置。
  security-defined: off

  # 常规错误由 `default` ErrorResponse 表达；需要重试延迟的 operation 另以显式
  # 429/503 引用 RetryableErrorResponse。两者共用 ErrorEnvelope，因此不要求
  # 每个 operation 另行列出显式 4xx response。
  operation-4xx-response: off

  # 这是私有项目的内部 API Contract，不是对外发布的 API 描述，仓库也未确定许可证。
  # 与其填入未经确认的 license，不如显式关闭该规则。
  info-license: off
