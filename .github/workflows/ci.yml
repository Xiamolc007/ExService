name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    # PostgreSQL, Redis and Nginx fixtures require Linux containers.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository and Outline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install Corepack and locate runtime tools
        run: |
          npm install --global corepack@0.34.6
          echo "INTEGRATION_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          echo "INTEGRATION_COREPACK_JS=$(npm root --global)/corepack/dist/corepack.js" >> "$GITHUB_ENV"

      - name: Verify Docker
        run: docker info

      - name: Install Website dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Outline dependencies
        working-directory: apps/outline
        run: corepack yarn install --immutable

      - name: Verify generated API Contract
        run: pnpm api:check

      - name: Type-check workspaces
        run: pnpm typecheck

      - name: Test Website, runtime and Outline
        run: pnpm test

      - name: Build Website and Outline
        run: pnpm build

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
