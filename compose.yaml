name: exwebsite-runtime
services:
  postgres:
    image: ${RUNTIME_POSTGRES_IMAGE:?}
    labels: {dev.exwebsite.runtime: dependencies}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ['127.0.0.1:${LOCAL_POSTGRES_PORT:?}:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER"']
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: ${RUNTIME_REDIS_IMAGE:?}
    labels: {dev.exwebsite.runtime: dependencies}
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:${LOCAL_REDIS_PORT:?}:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  hydra:
    image: ${RUNTIME_HYDRA_IMAGE:?}
    labels: {dev.exwebsite.runtime: dependencies}
    command: [serve, all, --dev]
    ports:
      - '127.0.0.1:${LOCAL_HYDRA_PUBLIC_PORT:?}:4444'
      - '127.0.0.1:${LOCAL_HYDRA_ADMIN_PORT:?}:4445'
    environment:
      DSN: ${RUNTIME_HYDRA_DSN:?}
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?}
      URLS_SELF_ISSUER: ${RUNTIME_ISSUER:?}
      URLS_LOGIN: ${RUNTIME_PUBLIC_ORIGIN:?}/identity/login
      URLS_CONSENT: ${RUNTIME_PUBLIC_ORIGIN:?}/identity/consent
      URLS_LOGOUT: ${RUNTIME_PUBLIC_ORIGIN:?}/identity/logout
      SERVE_PUBLIC_HOST: 0.0.0.0
      SERVE_ADMIN_HOST: 0.0.0.0
      TTL_AUTH_CODE: 60s
      TTL_ACCESS_TOKEN: 60s
      TTL_ID_TOKEN: 60s
      LOG_FORMAT: json
      LOG_LEVEL: warn
      LOG_LEAK_SENSITIVE_VALUES: 'false'
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:?}
    external: ${RUNTIME_POSTGRES_VOLUME_EXTERNAL:?}
  redisdata:
    name: ${REDIS_VOLUME_NAME:?}
    labels: {dev.exwebsite.runtime: dependencies}
